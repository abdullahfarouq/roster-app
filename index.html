<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Roster - نظام إدارة وتخطيط الموانئ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root {
  /* الألوان الأساسية للخلفيات */
  --bg-dark: #050505;
  --liquid-glass: rgba(24, 24, 28, 0.45);

  /* ألوان الحدود والشفافية */
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-shine: rgba(255, 255, 255, 0.15);

  /* ألوان النصوص والتباين */
  --cream: #F5F5F7;
  --muted: #8E8E93;

  /* مجموعة ألوان الهوية الأولى (الازرق السيبراني والتوهج) */
  --cyber-blue: #0A84FF;
  --blue-glow: rgba(10, 132, 255, 0.85);

  /* مجموعة ألوان الهوية الثانية (الأحمر النيون والتوهج) */
  --neon-red: #FF2E2E;
  --red-glow: rgba(255, 46, 46, 0.85);

  /* تعريف الخطوط المستخدمة للغة الإنجليزية والعربية */
  --font-en: 'Verdana Pro', 'Verdana', sans-serif;
  --font-ar: 'Arial', sans-serif;

  /* توافق داخلي مع بقية الواجهة حتى لا تتأثر الوظائف الحالية */
  --bg: var(--bg-dark);
  --glass: var(--liquid-glass);
  --glass-strong: rgba(24, 24, 28, 0.62);
  --border: var(--glass-border);
  --gold: var(--cyber-blue);
  --gold-dim: #0066CC;
  --danger: var(--neon-red);
  --ok: #30D158;
  --warn: #FF9F0A;
  --radius: 20px;
  --spring: cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(10,132,255,0.06), transparent 40%),
    radial-gradient(circle at 100% 20%, rgba(255,255,255,0.05), transparent 35%),
    radial-gradient(circle at 0% 100%, rgba(10,132,255,0.04), transparent 40%),
    var(--bg);
  color:var(--cream);
  font-family:var(--font-ar), "SF Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.glass{
  background:var(--glass);
  backdrop-filter:blur(50px) saturate(260%);
  -webkit-backdrop-filter:blur(50px) saturate(260%);
  border:1px solid var(--border);
}
.card{
  background:var(--glass);
  backdrop-filter:blur(50px) saturate(260%);
  -webkit-backdrop-filter:blur(50px) saturate(260%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
}
h1,h2,h3{font-weight:700;margin:0 0 10px 0;}
h1{color:var(--gold);font-size:1.4rem;letter-spacing:.3px;}
h2{font-size:1.15rem;color:var(--cream);}
h3{font-size:1rem;color:var(--gold);}
label{display:block;font-size:.8rem;color:#c8c8cf;margin-bottom:6px;}
input,select,textarea{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  color:var(--cream);
  border-radius:14px;
  padding:11px 13px;
  font-size:.92rem;
  font-family:var(--font-ar), "SF Arabic", sans-serif;
  direction:rtl;
  unicode-bidi:plaintext;
  text-align:right;
  word-wrap: break-word;
  overflow-wrap: break-word;
  transition:box-shadow .18s cubic-bezier(.175,.885,.32,1.275), transform .18s cubic-bezier(.175,.885,.32,1.275), border-color .18s;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(10,132,255,0.6);
  box-shadow:0 0 0 4px rgba(10,132,255,0.15);
  transform:scale(1.015);
}
textarea{resize:vertical;min-height:75px;line-height:1.6;}
.field{margin-bottom:12px;}
button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  border-radius:14px;
  padding:11px 18px;
  font-size:.9rem;
  font-weight:600;
  transition:transform .18s cubic-bezier(.175,.885,.32,1.275), box-shadow .18s;
}
button:active{transform:scale(.96);}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:#141406;}
.btn-nav{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;font-size:.92rem;font-weight:800;border-radius:14px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;}
.btn-nav:hover{transform:translateY(-1px);}
.btn-home{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#141406;border:1px solid var(--gold);box-shadow:0 8px 22px rgba(232,185,63,.28);}
.btn-back{background:rgba(255,255,255,0.09);color:var(--cream);border:1.5px solid rgba(255,255,255,.35);}
.btn-back:hover{border-color:var(--gold);}
.btn-gold:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 22px rgba(10,132,255,0.25);}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--cream);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(255,255,255,0.1);}
.btn-danger{background:rgba(255,46,46,0.15);color:var(--danger);border:1px solid rgba(255,46,46,0.3);}
.btn-sm{padding:7px 12px;font-size:.78rem;border-radius:10px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}
#app{max-width:1100px;margin:0 auto;padding:20px 16px 90px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin-bottom:18px;border-radius:22px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);}
.brand span{font-weight:800;font-size:1.25rem;letter-spacing:1px;color:var(--gold);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab{padding:9px 16px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:.85rem;cursor:pointer;color:#d8d8de;}
.tab.active{background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:#141406;font-weight:700;border-color:transparent;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:100px;font-size:.72rem;font-weight:700;}
.pill-A{background:rgba(61,220,132,0.16);color:var(--ok);}
.pill-B{background:rgba(255,176,32,0.16);color:var(--warn);}
.pill-C{background:rgba(255,46,46,0.16);color:var(--danger);}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,0.035);border:1px solid var(--border);margin-bottom:8px;}
.muted{color:#9a9aa2;font-size:.8rem;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.notice{background:rgba(10,132,255,0.06);border:1px solid rgba(10,132,255,0.25);border-radius:14px;padding:10px 14px;font-size:.78rem;color:#e8d998;margin-top:8px;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);word-wrap:break-word;overflow-wrap:break-word;}
th{color:var(--gold);font-weight:700;}
.crane-block{border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:12px;background:rgba(255,255,255,0.03);}
.stepper{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:6px 10px;}
.stepper-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--cream);font-size:1.15rem;font-weight:800;line-height:1;padding:0;}
.stepper-btn:hover{background:var(--gold);color:#141406;}
.stepper-val{flex:1;text-align:center;font-weight:800;color:var(--gold);font-size:.92rem;}
.stepper-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chip-btn{padding:5px 11px;border-radius:100px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:#d8d8de;font-size:.74rem;font-weight:700;}
.chip-btn:hover{background:var(--gold);color:#141406;border-color:transparent;}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:100px;padding:5px 12px;font-size:.78rem;margin:3px;}
.chip button{background:none;border:none;color:var(--danger);padding:0;font-size:.8rem;cursor:pointer;}
.empty{text-align:center;padding:30px;color:#8b8b93;}
.login-wrap{min-height:90vh;display:flex;align-items:center;justify-content:center;}
.login-card{max-width:420px;width:100%;}
.tbt-box{border:1.5px solid rgba(10,132,255,0.4);border-radius:18px;padding:16px;margin-bottom:16px;background:rgba(10,132,255,0.04);}
.tbt-box textarea{font-family:var(--font-ar), "SF Arabic", sans-serif;font-size:0.98rem;line-height:1.6;}
.ai-panel{position:fixed;left:16px;bottom:16px;width:min(360px,90vw);max-height:70vh;display:none;flex-direction:column;z-index:50;border-radius:22px;overflow:hidden;}
.ai-panel.open{display:flex;}
.ai-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.ai-msg{padding:9px 12px;border-radius:14px;font-size:.82rem;max-width:85%;word-wrap:break-word;overflow-wrap:break-word;}
.ai-msg.user{align-self:flex-start;background:rgba(10,132,255,0.14);}
.ai-msg.bot{align-self:flex-end;background:rgba(255,255,255,0.06);}
.ai-fab{position:fixed;left:16px;bottom:16px;z-index:49;border-radius:100px;padding:13px 20px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.audit{font-size:.75rem;color:#9a9aa2;}
.audit b{color:var(--cream);}

/* Printable Roster Table Styling */
.rt-table{width:100%;border-collapse:collapse;background:#fff;color:#111;font-family:var(--font-ar), "SF Arabic", sans-serif;font-size:.95rem;}
.rt-table th,.rt-table td{border:1.5px solid #000;padding:8px 10px;text-align:center;}
.rt-table thead tr:first-child th.rt-title{background:#1f3b57;color:#fff;font-size:1.15rem;font-weight:800;letter-spacing:.5px;}
.rt-table thead tr:first-child th.rt-team{background:#1f3b57;color:#fff;font-size:.9rem;}
.rt-table thead tr:nth-child(2) th{background:#7f8fa4;color:#fff;font-weight:700;}
.rt-table .rt-en{font-weight:400;font-size:.8rem;}
.rt-table tbody td{background:#c9d2da;font-weight:600;}
.rt-table tbody tr:nth-child(even) td{background:#dfe5ea;}
.rt-table td.rt-team{background:#b9c3cd;font-weight:700;}
.rt-table td.rt-op{font-weight:700;}
.rt-table td.rt-crane{font-weight:800;color:#155724;}
.print-wrap{background:#fff;border-radius:10px;padding:16px;direction:rtl;text-align:right;color:#000;font-family:var(--font-ar), "SF Arabic", sans-serif;}
.print-tbt{border:2px solid #C9A100;background:#FFF6D6;color:#3a2e00;border-radius:10px;padding:12px 14px;margin-bottom:12px;direction:rtl;text-align:right;}
.print-tbt h4{margin:0 0 6px 0;color:#8a6d00;font-size:1.05rem;font-family:var(--font-ar);}
.print-tbt p{margin:0;white-space:pre-wrap;unicode-bidi:plaintext;font-size:.95rem;line-height:1.5;font-family:var(--font-ar);}
.print-tasks{border:2px solid #2e7d32;background:#EAF6EA;color:#1b3a1b;border-radius:10px;padding:12px 14px;margin-top:12px;direction:rtl;text-align:right;}
.print-tasks h4{margin:0 0 8px 0;color:#2e7d32;font-size:1rem;font-family:var(--font-ar);}
.print-task-row{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;border-bottom:1px dashed #b7d8b7;font-size:.88rem;font-family:var(--font-ar);}
.print-task-row:last-child{border-bottom:none;}

/* Handover Excel Style Print Table */
.vessel-handover-block{margin-bottom:18px;}
.handover-crane-row{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,0.03);}
.chip-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.chip-toggle{padding:6px 13px;border-radius:100px;border:1px solid var(--border);font-size:.85rem;cursor:pointer;user-select:none;transition:all .15s ease;background:rgba(255,255,255,0.04);}
.chip-toggle:hover{border-color:var(--gold);}
.chip-toggle.active{background:var(--gold);color:#111;font-weight:700;border-color:var(--gold);}
.holdplan-controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px;}
.holdplan-hold-card{border:1px solid var(--border);border-radius:14px;padding:12px;background:rgba(255,255,255,0.03);}
.holdplan-hold-card.done{border-color:#2fae63;background:rgba(47,174,99,0.1);}
.holdplan-hold-card b{display:block;margin-bottom:6px;color:var(--gold);}
.excel-handover-table{width:100%;border-collapse:collapse;background:#fff;color:#000;font-family:var(--font-ar);font-size:1.05rem;direction:rtl;text-align:center;}
.excel-handover-table th,.excel-handover-table td{border:1.5px solid #000;padding:10px 8px;font-weight:bold;}
.excel-handover-table th{background:#e2e2e2;color:#000;font-size:1rem;}
.excel-handover-table th.vessel-header{background:#1f3b57;color:#fff;font-size:1.15rem;text-align:center;padding:10px;}
.excel-handover-table tr:nth-child(even) td{background:#f9f9f9;}
.print-yard{border:2px solid #1f3b57;border-radius:10px;overflow:hidden;margin-top:14px;font-family:var(--font-ar);direction:rtl;text-align:right;}
.print-yard h4{margin:0;background:#1f3b57;color:#fff;padding:10px 14px;font-size:1.05rem;}
.print-yard .body{padding:12px 14px;background:#f4f7f9;color:#111;font-size:.95rem;white-space:pre-wrap;unicode-bidi:plaintext;line-height:1.6;}

/* Rotation Calendar Styles */
.cal-shift-D{background:linear-gradient(135deg,#1e88e5,#1565c0);color:#fff;font-weight:bold;}
.cal-shift-N{background:linear-gradient(135deg,#5e35b1,#311b92);color:#fff;font-weight:bold;}
.cal-shift-O{background:rgba(255,255,255,0.06);color:#a0a0ab;}
.cal-table{width:100%;border-collapse:collapse;background:rgba(15,15,20,0.7);color:var(--cream);font-size:.85rem;border-radius:14px;overflow:hidden;}
.cal-table th,.cal-table td{border:1px solid var(--border);padding:8px 6px;text-align:center;}
.cal-table th{background:rgba(255,255,255,0.08);color:var(--gold);}
.holiday-badge{display:inline-block;background:rgba(255,46,46,0.2);color:var(--danger);border:1px solid rgba(255,46,46,0.4);border-radius:6px;padding:2px 6px;font-size:.7rem;margin-top:3px;}

.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px;}
@media(max-width:760px){.home-grid{grid-template-columns:repeat(2,1fr);}}
.home-tile{
  background:var(--glass);
  backdrop-filter:blur(50px) saturate(260%);
  -webkit-backdrop-filter:blur(50px) saturate(260%);
  border:1px solid var(--border);
  border-radius:24px;
  aspect-ratio:1/1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  cursor:pointer;
  transition:transform .2s cubic-bezier(.175,.885,.32,1.275), box-shadow .2s, border-color .2s;
}
.home-tile:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 30px rgba(10,132,255,0.15);border-color:rgba(10,132,255,0.4);}
.home-tile:active{transform:scale(.97);}
.home-tile-icon{font-size:2.6rem;filter:drop-shadow(0 4px 10px rgba(10,132,255,0.25));}
.home-tile-label{font-weight:700;font-size:.98rem;color:var(--cream);text-align:center;padding:0 8px;}

/* ===== Coverflow Selector + Glowing Signal Path (Home only — no traditional scrolling here) ===== */
.zviewport{ position:relative; height:min(66vh,600px); min-height:360px; display:flex; align-items:stretch; gap:clamp(10px,3vw,40px); margin-top:8px; }
.wave-rail{ width:clamp(60px,10vw,140px); flex-shrink:0; position:relative; overflow:visible; }
.wave-rail svg{ width:100%; height:100%; display:block; overflow:visible; }
.wave-g{ animation:waveSway 8s ease-in-out infinite; transform-origin:50% 50%; }
@keyframes waveSway{ 0%,100%{ transform:translateX(0) rotate(0deg); } 50%{ transform:translateX(4px) rotate(.5deg); } }
.wave-dot{ position:absolute; width:12px; height:12px; border-radius:50%; background:var(--gold); pointer-events:none;
  box-shadow:0 0 22px 7px rgba(10,132,255,.6), 0 0 0 4px rgba(10,132,255,.12); transform:translate(-50%,-50%);
  transition:top .55s var(--spring), left .55s var(--spring); z-index:3; }
.select-viewport{ flex:1; position:relative; overflow:hidden; touch-action:none; cursor:grab; min-width:0; }
.select-viewport:active{ cursor:grabbing; }
.zgrid{ position:absolute; inset:0; }
.zcard{ position:absolute; left:50%; top:50%; width:min(360px,86vw); border-radius:20px; overflow:hidden; padding:0; cursor:pointer;
  transform-origin:center center; will-change:transform,opacity; display:flex; flex-direction:column;
  background:var(--glass); backdrop-filter:blur(50px) saturate(260%); -webkit-backdrop-filter:blur(50px) saturate(260%); border:1px solid var(--border); }
.zcard .imgwrap{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden;
  background:linear-gradient(150deg, rgba(10,132,255,.16), rgba(255,255,255,.06)); display:flex; align-items:center; justify-content:center; }
.zcard .ic{ font-size:clamp(34px,6vw,52px); filter:drop-shadow(0 6px 18px rgba(0,0,0,.4)); transition:transform .4s var(--spring); }
.zcard:hover .ic{ transform:scale(1.12) rotate(-3deg); }
.zcard .panel{ padding:14px 18px 18px; border-top:1px solid var(--border); }
.zcard .num{ font-size:11px; letter-spacing:2px; color:#9a9aa2; font-family:ui-monospace,Menlo,monospace; margin-bottom:6px; }
.zcard .t{ font-size:clamp(14px,2vw,16px); font-weight:700; color:var(--cream); }
.zcard.is-active{ box-shadow:0 26px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1.5px rgba(10,132,255,.35); }
.zcard.is-active .num{ color:var(--gold); }
.zcard:not(.is-active) .panel{ opacity:.6; }
.zripple{ position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(10,132,255,.55), transparent 70%);
  transform:translate(-50%,-50%) scale(0); pointer-events:none; animation:zrippleGo .65s cubic-bezier(.22,.61,.36,1) forwards; z-index:5; }
@keyframes zrippleGo{ 0%{ transform:translate(-50%,-50%) scale(0); opacity:.9; } 100%{ transform:translate(-50%,-50%) scale(9); opacity:0; } }
.zhint{ position:absolute; bottom:6px; right:clamp(8px,2vw,20px); font-size:11px; color:#9a9aa2;
  display:flex; align-items:center; gap:6px; opacity:.75; pointer-events:none; z-index:2; }
.zhint .wheel-ic{ width:16px; height:24px; border:1.5px solid #9a9aa2; border-radius:9px; position:relative; flex-shrink:0; }
.zhint .wheel-ic::after{ content:""; position:absolute; top:4px; left:50%; width:2px; height:5px; background:#9a9aa2; transform:translateX(-50%); animation:zhintBob 1.4s ease-in-out infinite; }
@keyframes zhintBob{ 0%,100%{ top:4px; opacity:1;} 50%{ top:11px; opacity:.3;} }
@media(prefers-reduced-motion:reduce){ .zcard,.wave-dot{ transition:none!important; } .wave-g{ animation:none!important; } }
@media (max-width:760px){ .zviewport{ flex-direction:row-reverse; height:min(60vh,520px); gap:8px; } .wave-rail{ width:32px; } .zhint span:last-child{ display:none; } }
@media (max-width:420px){ .zcard{ width:82vw; } }
.crew-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
@media(max-width:760px){.crew-menu{grid-template-columns:repeat(2,1fr);}}
.crew-menu-tile{background:rgba(255,255,255,0.035);border:1px solid var(--border);border-radius:18px;padding:20px 10px;text-align:center;cursor:pointer;transition:transform .18s, border-color .18s;}
.crew-menu-tile:hover{transform:translateY(-3px);border-color:rgba(10,132,255,0.35);}
.crew-menu-tile .ic{font-size:1.8rem;margin-bottom:8px;}
::-webkit-scrollbar{width:8px;}

:root{
  --af-bg:#050505;
  --af-glass:rgba(24,24,28,.45);
  --af-glass-strong:rgba(24,24,28,.68);
  --af-border:rgba(255,255,255,.08);
  --af-shine:rgba(255,255,255,.15);
  --af-blue:#0A84FF;
  --af-blue-glow:rgba(10,132,255,.85);
  --af-red:#FF2E2E;
  --af-red-glow:rgba(255,46,46,.85);
  --af-cream:#F5F5F7;
  --af-muted:#8E8E93;
  --af-font-en:'Verdana Pro','Verdana',sans-serif;
  --af-font-ar:'Arial',sans-serif;
  --af-ease:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(10,132,255,.72) rgba(255,255,255,.035);}
html::-webkit-scrollbar{width:9px;height:9px}
html::-webkit-scrollbar-track{background:rgba(255,255,255,.025)}
html::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--af-blue),rgba(255,46,46,.82));border-radius:99px;border:2px solid #050505}
html::-webkit-scrollbar-thumb:hover{box-shadow:0 0 18px var(--af-blue-glow)}
body{
  background:
    radial-gradient(circle at 15% 0%,rgba(10,132,255,.075),transparent 38%),
    radial-gradient(circle at 92% 28%,rgba(255,46,46,.045),transparent 34%),
    radial-gradient(circle at 0% 100%,rgba(10,132,255,.045),transparent 42%),
    var(--af-bg)!important;
  color:var(--af-cream)!important;
  font-family:var(--af-font-ar),Arial,sans-serif!important;
  overflow-x:hidden;
}
body.af-scrolled{--af-accent:var(--af-red);}
body:not(.af-scrolled){--af-accent:var(--af-blue);}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 24%,transparent 76%,rgba(255,46,46,.012));}
*{scrollbar-width:thin;}
button,input,select,textarea{font-family:var(--af-font-ar),Arial,sans-serif!important;}
.glass,.card,.home-tile,.list-item,.crane-block,.tabs .tab,.topbar,.ai-panel,.ai-fab,.tbt-box{
  background:var(--af-glass)!important;
  border-color:var(--af-border)!important;
  box-shadow:inset 0 1px 0 var(--af-shine),0 18px 50px rgba(0,0,0,.22);
  backdrop-filter:blur(32px) saturate(190%)!important;
  -webkit-backdrop-filter:blur(32px) saturate(190%)!important;
}
.card,.home-tile,.crane-block{transition:transform .45s var(--af-ease),border-color .35s ease,box-shadow .45s ease,background .35s ease;}
.card:hover,.home-tile:hover,.crane-block:hover{border-color:rgba(10,132,255,.25)!important;box-shadow:inset 0 1px 0 var(--af-shine),0 24px 70px rgba(0,0,0,.34),0 0 30px rgba(10,132,255,.045);}
h1,h3,.brand span,th{color:var(--af-blue)!important;text-shadow:0 0 18px rgba(10,132,255,.16);}
h2{color:var(--af-cream)!important;}
.muted{color:var(--af-muted)!important;}
input,select,textarea{background:rgba(255,255,255,.045)!important;border-color:var(--af-border)!important;color:var(--af-cream)!important;backdrop-filter:blur(18px);}
input:focus,select:focus,textarea:focus{border-color:rgba(10,132,255,.65)!important;box-shadow:0 0 0 4px rgba(10,132,255,.12),0 0 24px rgba(10,132,255,.12)!important;}
.btn-gold{background:linear-gradient(135deg,#0A84FF,#0066CC)!important;color:#fff!important;box-shadow:0 8px 26px rgba(10,132,255,.18);}

.btn-danger{background:rgba(255,46,46,.12)!important;color:var(--af-red)!important;border-color:rgba(255,46,46,.34)!important;}

.zcard{background:var(--af-glass)!important;border:1px solid var(--af-border)!important;box-shadow:inset 0 1px 0 var(--af-shine),0 30px 60px rgba(0,0,0,.6)!important;backdrop-filter:blur(28px) saturate(180%)!important;}
.zcard.is-active{border-color:rgba(10,132,255,.55)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 70px rgba(0,0,0,.72),0 0 34px rgba(10,132,255,.13)!important;}

.cal-shift-D{background:linear-gradient(135deg,#0A84FF,#0066CC)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 18px rgba(10,132,255,.14);}

.rt-table tbody tr:hover td{background:rgba(10,132,255,.07)!important;}
.rt-table td.rt-crane{color:#6BE7FF!important;}
.roster-brand-row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--af-border);border-radius:16px;background:rgba(255,255,255,.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}

#globalScrollProgress{position:fixed;top:0;left:0;height:2px;width:0%;z-index:10001;background:linear-gradient(90deg,var(--af-blue),var(--af-red));box-shadow:0 0 14px rgba(10,132,255,.55),0 0 12px rgba(255,46,46,.25);pointer-events:none;transition:width .06s linear;}
#globalScrollRail{position:fixed;right:7px;top:18%;height:64%;width:3px;border-radius:99px;background:rgba(255,255,255,.045);z-index:999;pointer-events:none;overflow:hidden;}
[dir="rtl"] #globalScrollRail{right:auto;left:7px;}

#splash-screen{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:#050505;opacity:1;visibility:visible;transition:opacity .8s ease,visibility .8s ease;}

@keyframes afLogoIn{0%{opacity:0;transform:scale(.65);filter:blur(12px) drop-shadow(0 0 0 transparent)}100%{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 0 34px var(--af-blue-glow))}}
@keyframes afFadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes afLine{0%{opacity:0;width:0}100%{opacity:1;width:110px}}
#tabContent{animation:afPageIn .48s var(--af-ease) both;}

<script>
/* ===================== STATE & STORAGE ===================== */
let state = null;
let currentTab = 'home';
let previousTab = null;
let aiHistory = [];

const shiftNamesArabic = {
  1: 'الوردية الأولى',
  2: 'الوردية الثانية',
  3: 'الوردية الثالثة',
  4: 'الوردية الرابعة'
};

/* ===================== i18n ===================== */
const I18N = {
  en:{
    home:'Home', share:'Share as image',
    tab_crew:'Operations & Equipment', tab_pier:'Berth Plan', tab_roster:'Shift Schedule',
    tab_calendar:'Rotation Table', tab_leaves:'Leaves', tab_handover:'Handover', tab_settings:'Settings',
    tab_holdplan:'Hold Plan', tab_kpi:'Performance & KPIs', tab_reports:'Activity Log', tab_yardmgmt:'Yard',
    login_title:'Sign in to save & sync your data', login_name:'Name', login_phone:'Phone (optional)',
    login_email:'Email (optional)', login_btn:'Sign in', login_hint:'Use the same name/phone from any device to retrieve your saved data.'
  },
  ar:{
    home:'الرئيسية', share:'مشاركة كصورة',
    tab_crew:'التشغيل والمعدات', tab_pier:'خطة الأرصفة', tab_roster:'جدول الوردية',
    tab_calendar:'جدول المناوبات', tab_leaves:'الإجازات', tab_handover:'التسليم والتسلم', tab_settings:'الإعدادات',
    tab_holdplan:'مخطط العنابر', tab_kpi:'الأداء والـ KPIs', tab_reports:'سجل العمليات', tab_yardmgmt:'اليارد',
    login_title:'سجّل الدخول لحفظ ومزامنة بياناتك', login_name:'الاسم', login_phone:'رقم التليفون (اختياري)',
    login_email:'البريد الإلكتروني (اختياري)', login_btn:'دخول', login_hint:'استخدم نفس الاسم أو رقم التليفون من أي جهاز لاسترجاع بياناتك المحفوظة.'
  }
};
function currentLang(){ return (state && state.lang) || localStorage.getItem('roster_lang') || 'en'; }
function t(key){ const l=currentLang(); return (I18N[l]&&I18N[l][key]) || I18N.en[key] || key; }
function tTab(id){ return t('tab_'+id); }
function setLang(l){
  localStorage.setItem('roster_lang', l);
  if(state){ state.lang = l; saveState(); }
  document.documentElement.setAttribute('lang', l);
  document.documentElement.setAttribute('dir', l==='ar'?'rtl':'ltr');
  render();
}

function keyFor(email){
  return 'roster_app:' + (email||'').toLowerCase().trim().replace(/[^a-z0-9.]/g,'_');
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowStr(){ const d=new Date(); return d.toLocaleString('ar-EG'); }

function blankState(loginId,name,phone,email){
  return {
    loginId, name, phone:phone||'', email:email||'', shiftName:'الوردية الأولى',
    lang: localStorage.getItem('roster_lang') || 'en',
    crew:{ operators:[], loaders:[], forklifts:[], cranes:[], other:[] },
    vessels:[],
    leaves:[],
    handovers:[],
    handoverVessels:[],
    holdPlans:[],
    yard:{ name:'', notes:'' },
    rosterDates:{},
    logs:[],
    geminiApiKey:'',
    kpi:{ vesselLogs:[], incidents:[], breakdowns:[] }
  };
}
function ensureKPI(){
  if(!state.kpi) state.kpi = {vesselLogs:[], incidents:[], breakdowns:[]};
  if(!state.kpi.vesselLogs) state.kpi.vesselLogs = [];
  if(!state.kpi.incidents) state.kpi.incidents = [];
  if(!state.kpi.breakdowns) state.kpi.breakdowns = [];
}
function ensureYardData(){
  if(!state.yardData) state.yardData = {yards:[], transactions:[]};
  if(!state.yardData.yards) state.yardData.yards = [];
  if(!state.yardData.transactions) state.yardData.transactions = [];
}

function saveState(){
  try{
    if(!state || !state.loginId) return;
    localStorage.setItem(keyFor(state.loginId), JSON.stringify(state));
    localStorage.setItem('roster_current_user_id', state.loginId);
    localStorage.setItem('roster_current_user_name', state.name);
    pushStateToFirebase();
  }catch(e){ console.error('save failed', e); alert(currentLang()==='ar'?'تعذر حفظ البيانات محلياً — تأكد أن مساحة التخزين غير ممتلئة.':'Could not save data locally — please check your storage space.'); }
}

/* ===================== FIREBASE MULTI-USER LIVE SYNC =====================
   Optional: off by default, works purely on localStorage (per-device, single
   user) until the user pastes their own Firebase project config + a shared
   "workspace code" in Settings. Once connected, every account that uses the
   same workspace code sees the same data update live (create/edit/delete
   anywhere reflects everywhere within ~1 second) — so anyone, even someone
   on leave who opens the app later, sees exactly what happened. */
let fbApp=null, fbDb=null, fbDocRef=null, fbUnsub=null;
let fbLocalRev=0, fbLastPushedRev=0, fbPushTimer=null;
let fbSyncStatus='offline'; // offline | connecting | connected | error | not_configured
function fbCfgKey(){ return 'roster_firebase_cfg'; }
function getFirebaseCfg(){
  try{ return JSON.parse(localStorage.getItem(fbCfgKey())||'null'); }catch(e){ return null; }
}
function saveFirebaseCfg(cfg){ localStorage.setItem(fbCfgKey(), JSON.stringify(cfg)); }
function clearFirebaseCfg(){
  localStorage.removeItem(fbCfgKey());
  if(fbUnsub){ try{ fbUnsub(); }catch(e){} }
  fbApp=null; fbDb=null; fbDocRef=null; fbUnsub=null; fbSyncStatus='offline';
}
function updateSyncBadge(){
  const b = document.getElementById('fbSyncBadge');
  if(!b) return;
  const ar = currentLang()==='ar';
  const map = {
    offline:      ['⚪', ar?'محلي فقط (بدون مزامنة)':'Local only (not synced)'],
    not_configured:['⚪', ar?'محلي فقط (بدون مزامنة)':'Local only (not synced)'],
    connecting:   ['🟡', ar?'جارِ الاتصال...':'Connecting...'],
    connected:    ['🟢', ar?'متصل ومتزامن مع كل الحسابات':'Live — synced across all accounts'],
    error:        ['🔴', ar?'خطأ في الاتصال بالمزامنة':'Sync connection error'],
    sdk_missing:  ['🔴', ar?'تعذر تحميل مكتبة المزامنة (تأكد من الاتصال بالإنترنت)':'Sync library failed to load (check internet connection)']
  };
  const [dot,label] = map[fbSyncStatus]||map.offline;
  b.innerHTML = `${dot} ${label}`;
}
function connectFirebase(){
  const cfg = getFirebaseCfg();
  if(!cfg || !cfg.apiKey || !cfg.projectId || !cfg.workspaceCode){ fbSyncStatus='not_configured'; updateSyncBadge(); return; }
  try{
    if(typeof firebase==='undefined'){ fbSyncStatus='sdk_missing'; updateSyncBadge(); return; }
    if(!fbApp){
      fbApp = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp({
        apiKey:cfg.apiKey, authDomain:cfg.authDomain, projectId:cfg.projectId,
        storageBucket:cfg.storageBucket, messagingSenderId:cfg.messagingSenderId, appId:cfg.appId
      });
    }
    fbDb = firebase.firestore();
    fbDocRef = fbDb.collection('roster_workspaces').doc(cfg.workspaceCode);
    if(fbUnsub){ try{ fbUnsub(); }catch(e){} }
    fbSyncStatus='connecting'; updateSyncBadge();
    fbUnsub = fbDocRef.onSnapshot(snap=>{
      if(!snap.exists){ fbSyncStatus='connected'; updateSyncBadge(); return; }
      const remote = snap.data();
      if(!remote || !remote.data) return;
      if(remote.rev && remote.rev===fbLastPushedRev){
        // this is just Firestore confirming the write we just made — ignore, avoid a self-triggered re-render loop
        fbLocalRev = remote.rev; fbSyncStatus='connected'; updateSyncBadge(); return;
      }
      const keepLoginId = state ? state.loginId : null, keepName = state ? state.name : null;
      state = remote.data;
      if(keepLoginId) state.loginId = keepLoginId;
      if(keepName) state.name = keepName;
      ensureKPI(); ensureYardData();
      if(!state.holdPlans) state.holdPlans = [];
      fbLocalRev = remote.rev||fbLocalRev;
      try{ localStorage.setItem(keyFor(state.loginId), JSON.stringify(state)); }catch(e){}
      fbSyncStatus='connected'; updateSyncBadge();
      renderTab();
    }, err=>{ console.error('Firebase sync error', err); fbSyncStatus='error'; updateSyncBadge(); });
  }catch(e){ console.error('Firebase connect failed', e); fbSyncStatus='error'; updateSyncBadge(); }
}
function pushStateToFirebase(){
  if(!fbDocRef) return;
  clearTimeout(fbPushTimer);
  fbPushTimer = setTimeout(()=>{
    fbLocalRev += 1;
    fbLastPushedRev = fbLocalRev;
    const payload = JSON.parse(JSON.stringify(state));
    fbDocRef.set({ data: payload, rev: fbLocalRev, updatedAt: Date.now(), updatedBy: state.name||state.loginId||'?' })
      .catch(e=>{ console.error('Firebase push failed', e); fbSyncStatus='error'; updateSyncBadge(); });
  }, 700);
}
function saveFirebaseSettingsForm(){
  const ar = currentLang()==='ar';
  const cfg = {
    apiKey: document.getElementById('fbApiKey').value.trim(),
    authDomain: document.getElementById('fbAuthDomain').value.trim(),
    projectId: document.getElementById('fbProjectId').value.trim(),
    storageBucket: document.getElementById('fbStorageBucket').value.trim(),
    messagingSenderId: document.getElementById('fbSenderId').value.trim(),
    appId: document.getElementById('fbAppId').value.trim(),
    workspaceCode: document.getElementById('fbWorkspaceCode').value.trim()
  };
  if(!cfg.apiKey || !cfg.projectId || !cfg.workspaceCode){
    alert(ar?'من فضلك أدخل على الأقل: API Key وProject ID وكود المؤسسة':'Please enter at least: API Key, Project ID and workspace code');
    return;
  }
  saveFirebaseCfg(cfg);
  fbApp=null; fbDb=null; fbDocRef=null;
  connectFirebase();
  renderTab();
}
function disconnectFirebaseUI(){
  const ar = currentLang()==='ar';
  if(!confirm(ar?'قطع المزامنة السحابية عن هذا الجهاز؟ البيانات المحلية هتفضل موجودة.':'Disconnect cloud sync on this device? Local data stays intact.')) return;
  clearFirebaseCfg(); renderTab();
}

function log(entity, action, before, after){
  if(!state.logs) state.logs = [];
  state.logs.unshift({id:uid(), ts:nowStr(), entity, action, before, after, user:state.name});
  if(state.logs.length>500) state.logs.length=500;
}

/* ===================== LOGIN ===================== */
function tryLogin(){
  const name = document.getElementById('loginName').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  if(!name){ alert(currentLang()==='ar'?'من فضلك ادخل الاسم':'Please enter your name'); return; }
  const loginId = (phone || email || name);
  try{
    const localData = localStorage.getItem(keyFor(loginId));
    if(localData){
      state = JSON.parse(localData);
      state.name = name;
      if(phone) state.phone = phone;
      if(email) state.email = email;
      if(!state.crew.cranes) state.crew.cranes = [];
      if(!state.handoverVessels) state.handoverVessels = [];
      if(!state.holdPlans) state.holdPlans = [];
      if(!state.yard) state.yard = {name:'', notes:''};
      if(!state.lang) state.lang = localStorage.getItem('roster_lang') || 'en';
      ensureKPI(); ensureYardData();
    } else {
      state = blankState(loginId, name, phone, email);
    }
    saveState();
  }catch(e){
    state = blankState(loginId, name, phone, email);
    saveState();
  }
  document.documentElement.setAttribute('lang', state.lang);
  document.documentElement.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');
  connectFirebase();
  render();
}

function checkAutoLogin(){
  try{
    const savedId = localStorage.getItem('roster_current_user_id');
    const savedName = localStorage.getItem('roster_current_user_name');
    if(savedId){
      const localData = localStorage.getItem(keyFor(savedId));
      if(localData){
        state = JSON.parse(localData);
        if(savedName) state.name = savedName;
        if(!state.crew.cranes) state.crew.cranes = [];
        if(!state.handoverVessels) state.handoverVessels = [];
        if(!state.holdPlans) state.holdPlans = [];
        if(!state.yard) state.yard = {name:'', notes:''};
        if(!state.lang) state.lang = localStorage.getItem('roster_lang') || 'en';
        ensureKPI(); ensureYardData();
        document.documentElement.setAttribute('lang', state.lang);
        document.documentElement.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');
        connectFirebase();
      }
    }
  }catch(e){ console.error('auto login failed', e); }
}

function renderLogin(){
  const app = document.getElementById('app');
  const l = currentLang();
  app.innerHTML = `
  <div class="login-wrap">
    <div class="card login-card">
      <div class="row" style="justify-content:flex-end;margin-bottom:10px;">
        <button class="btn-ghost btn-sm ${l==='en'?'btn-gold':''}" onclick="setLang('en')">English</button>
        <button class="btn-ghost btn-sm ${l==='ar'?'btn-gold':''}" onclick="setLang('ar')">العربية</button>
      </div>
      <div class="brand brand-stack" style="margin-bottom:18px;justify-content:center;">
        <img class="brand-logo" src="af-logic-logo.png" alt="AF LOGIC">
        <span class="brand-name">ROSTER</span>
        <span class="brand-tagline">SIMPLY BETTER LOGIC</span>
      </div>
      <h2 style="text-align:center;color:var(--cream);font-weight:400;margin-bottom:20px;">${t('login_title')}</h2>
      <div class="field"><label>${t('login_name')}</label><input id="loginName" placeholder="${t('login_name')}"></div>
      <div class="field"><label>${t('login_phone')}</label><input id="loginPhone" placeholder="+20..." type="tel"></div>
      <div class="field"><label>${t('login_email')}</label><input id="loginEmail" placeholder="example@mail.com" type="email"></div>
      <button class="btn-gold" style="width:100%;margin-top:6px;" id="loginBtn" onclick="tryLogin()">${t('login_btn')}</button>
      <p class="muted" style="text-align:center;margin-top:14px;">${t('login_hint')}</p>
    </div>
  </div>`;
}

/* ===================== SHELL / TABS ===================== */
const TABS = [
  {id:'crew', label:'التشغيل والمعدات', icon:'🏗️'},
  {id:'pier', label:'خطة الأرصفة', icon:'⚓'},
  {id:'roster', label:'جدول الوردية', icon:'📋'},
  {id:'calendar', label:'جدول المناوبات', icon:'🗓️'},
  {id:'leaves', label:'الإجازات', icon:'🌴'},
  {id:'handover', label:'التسليم والتسلم', icon:'🔄'},
  {id:'holdplan', label:'مخطط العنابر', icon:'🚢'},
  {id:'kpi', label:'الأداء والـ KPIs', icon:'📊'},
  {id:'yardmgmt', label:'اليارد', icon:'🏭'},
  {id:'reports', label:'سجل العمليات', icon:'🧾'},
  {id:'settings', label:'الإعدادات', icon:'⚙️'},
];

function render(){
  if(!state){ renderLogin(); return; }
  const app = document.getElementById('app');
  const isHome = currentTab==='home';
  const ar = currentLang()==='ar';
  app.innerHTML = `
    <div class="topbar glass">
      <div class="brand brand-stack brand-header" style="cursor:pointer;" onclick="switchTab('home')">
        <img class="brand-logo" src="af-logic-logo.png" alt="AF LOGIC">
        <span class="brand-name">ROSTER</span>
        <span class="brand-tagline">SIMPLY BETTER LOGIC</span>
      </div>
      <div class="row" style="gap:10px;">
        <span class="muted">${esc(state.name)}</span>
        ${!isHome?`<button class="btn-nav btn-back" onclick="goBack()">◀ ${ar?'رجوع':'Back'}</button>`:''}
        ${!isHome?`<button class="btn-nav btn-home" onclick="switchTab('home')">🏠 ${t('home')}</button>`:''}
        ${!isHome?`<button class="btn-ghost btn-sm" onclick="shareCurrent()">📤 ${t('share')}</button>`:''}
      </div>
    </div>
    <div id="tabContent"></div>
  `;
  renderTab();
}
function switchTab(id){
  if(id!==currentTab) previousTab = currentTab;
  currentTab=id; render();
}
function goBack(){
  if(previousTab && previousTab!==currentTab){ switchTab(previousTab); }
  else { switchTab('home'); }
}
function renderTab(){
  const c = document.getElementById('tabContent');
  if(!c) return;
  if(currentTab==='home') c.innerHTML = viewHome();
  else if(currentTab==='crew') c.innerHTML = viewCrew();
  else if(currentTab==='pier') c.innerHTML = viewPier();
  else if(currentTab==='roster') c.innerHTML = viewRoster();
  else if(currentTab==='calendar') c.innerHTML = viewCalendar();

/* =========================================================
   DYNAMIC TABLE SIZING — "the table grows to match its data".
   Every printable table (roster / berth-plan) uses the shared
   .rt-table class, so this one engine sizes ALL of them the
   same way: fewer rows/columns => bigger, roomier text; more
   rows/columns => the size steps down gracefully so everything
   still fits and stays readable. Runs after every render and
   right before any print/share capture.
========================================================= */
function applyDynamicTableSizing(){
  document.querySelectorAll('.rt-table').forEach(table=>{
    const body = table.tBodies && table.tBodies[0];
    const rowCount = body ? body.rows.length : 0;
    const headRow = table.tHead && table.tHead.rows[table.tHead.rows.length-1];
    const colCount = headRow ? headRow.cells.length : 4;

    // Base sizes are generous (large table = few rows) and step
    // down as more rows/columns are packed in, never going below
    // a comfortably readable floor.
    let base;
    if(rowCount <= 3) base = 34;
    else if(rowCount <= 6) base = 30;
    else if(rowCount <= 10) base = 26;
    else if(rowCount <= 16) base = 22;
    else base = 19;

    if(colCount >= 7) base -= 2;
    base = Math.max(16, Math.min(34, base));

    const cellPad = Math.max(10, Math.round(base * 0.78));
    const headBase = Math.min(base + 4, 36);

    // setProperty(...,'important') so this always wins over the page's
    // many legacy !important CSS rules, regardless of screen size or
    // which print/media block last touched .rt-table in the stylesheet.
    table.style.setProperty('font-size', base+'px', 'important');
    table.querySelectorAll('td').forEach(td=>{
      td.style.setProperty('font-size', base+'px', 'important');
      td.style.setProperty('padding', cellPad+'px '+(cellPad+2)+'px', 'important');
    });
    table.querySelectorAll('th').forEach(th=>{
      th.style.setProperty('font-size', headBase+'px', 'important');
      th.style.setProperty('padding', cellPad+'px '+(cellPad+2)+'px', 'important');
    });
    table.querySelectorAll('.rt-team, .rt-title').forEach(el=>{
      el.style.setProperty('font-size', (headBase+6)+'px', 'important');
      el.style.setProperty('font-weight', '900', 'important');
    });
  });
}

/* ===================== HOME Z-SCENE ENGINE ===================== */
const Z = { cards:[], count:0, target:0, current:0, hoverIdx:-1, dragging:false, dragStartY:0, dragStartTarget:0, raf:null };
function zRowStep(){
  const vp = document.getElementById('selectViewport');
  const h = vp ? vp.clientHeight : 500;
  return Math.max(60, Math.min(150, h*0.22));
}
function zRender(){
  const step = zRowStep();
  const activeIdx = Math.round(Z.current);
  Z.cards.forEach((el,i)=>{
    let diff = i - Z.current;
    const dist = Math.abs(diff);
    const hoverPull = (i===Z.hoverIdx && i!==activeIdx) ? -Math.sign(diff)*0.18 : 0;
    diff += hoverPull;
    const ty = diff*step;
    const scale = Math.max(0.62, 1 - dist*0.13);
    const opacity = Math.max(0.16, 1 - dist*0.30);
    el.style.transform = `translate(-50%, calc(-50% + ${ty}px)) scale(${scale})`;
    el.style.opacity = opacity.toFixed(3);
    el.classList.toggle('is-active', i===activeIdx);
    el.style.zIndex = 100 - Math.round(dist*10);
    el.style.pointerEvents = dist < 4 ? 'auto' : 'none';
  });
  const dot = document.getElementById('waveDot');
  const rail = dot ? dot.parentElement : null;
  if(dot && rail){
    const railW = rail.clientWidth || 100;
    const railH = rail.clientHeight || 400;
    const pct = Z.count>1 ? Z.current/(Z.count-1) : 0;
    const topPx = 6 + pct*(railH-12);
    const curveX = 0.94 - pct*0.55 + Math.sin(pct*Math.PI*1.6)*0.14;
    dot.style.top = topPx+'px';
    dot.style.left = (curveX*railW)+'px';
  }
}
function zTick(){
  const diff = Z.target - Z.current;
  if(Math.abs(diff) < 0.004){ Z.current = Z.target; zRender(); Z.raf = null; return; } // demand rendering: توقف عند الاستقرار
  Z.current += diff * 0.17;
  zRender();
  Z.raf = requestAnimationFrame(zTick);
}
function zRequestFrame(){ if(!Z.raf) Z.raf = requestAnimationFrame(zTick); }
function zSetTarget(v){ Z.target = Math.max(0, Math.min(Z.count-1, v)); zRequestFrame(); }
function zRipple(el, ev){
  const r = el.getBoundingClientRect();
  const span = document.createElement('span');
  span.className = 'zripple';
  const size = Math.max(r.width, r.height)*1.1;
  span.style.width = span.style.height = size+'px';
  span.style.left = ((ev.clientX ?? (r.left+r.width/2)) - r.left)+'px';
  span.style.top = ((ev.clientY ?? (r.top+r.height/2)) - r.top)+'px';
  el.appendChild(span);
  setTimeout(()=> span.remove(), 700);
}
function initZScene(){
  const vp = document.getElementById('zViewport');
  const svp = document.getElementById('selectViewport');
  const grid = document.getElementById('zGrid');
  if(!vp || !svp || !grid) return; // مش في صفحة الهوم دلوقتي
  Z.cards = [...grid.querySelectorAll('.zcard')];
  Z.count = Z.cards.length;
  Z.target = 0; Z.current = 0; Z.hoverIdx = -1;
  zRender();

  Z.cards.forEach((el,i)=>{
    el.addEventListener('mouseenter', ()=>{ Z.hoverIdx=i; zRequestFrame(); });
    el.addEventListener('mouseleave', ()=>{ if(Z.hoverIdx===i){ Z.hoverIdx=-1; zRequestFrame(); } });
    el.addEventListener('click', (e)=>{
      const idx = Math.round(Z.current);
      if(i!==idx){ zSetTarget(i); return; } // أول نقرة تحدد الاختيار كمنتصف المشهد
      zRipple(el, e); // نقرة ثانية على العنصر المُختار: تأثير مبهر هادئ قبل فتح القسم
      setTimeout(()=> switchTab(el.dataset.tab), 260);
    });
  });

  svp.addEventListener('wheel', (e)=>{
    e.preventDefault(); // مفيش سكرول تقليدي هنا — العجلة بتحرك الاختيار فقط
    zSetTarget(Z.target + (e.deltaY>0? 0.42 : -0.42) * Math.max(1, Math.abs(e.deltaY)/60));
  }, {passive:false});

  svp.addEventListener('touchstart', (e)=>{
    Z.dragging = true; Z.dragStartY = e.touches[0].clientY; Z.dragStartTarget = Z.target;
  }, {passive:true});
  svp.addEventListener('touchmove', (e)=>{
    if(!Z.dragging) return;
    const dy = Z.dragStartY - e.touches[0].clientY;
    zSetTarget(Z.dragStartTarget + dy/zRowStep());
  }, {passive:true});
  svp.addEventListener('touchend', ()=>{ Z.dragging = false; });

  if(!Z.resizeBound){ window.addEventListener('resize', zRender); Z.resizeBound = true; }
}

async function handlePierImageUpload(input){
  const file = input.files[0];
  if(!file) return;
  if(!state.geminiApiKey){
    alert('يرجى إضافة مفتاح Gemini API في صفحة الإعدادات أولاً لاستخدام ميزة تحليل الصور بالذكاء الاصطناعي.');
    input.value = '';
    return;
  }
  const statusEl = document.getElementById('pierImageStatus');
  if(statusEl) statusEl.innerText = '⏳ جاري قراءة الصورة واستخراج المراكب...';

  const reader = new FileReader();
  reader.onload = async function(e){
    const base64Data = e.target.result.split(',')[1];
    const mimeType = file.type || 'image/jpeg';

    try {
      const sys = "أنت مساعد خبير بالموانئ. قم بتحليل صورة جدول البيرس بلان (Pier Plan) واستخراج المراكب منها. أريد النتيجة بصيغة JSON فقط مصفوفة كالتالي: [{\"name\":\"اسم المركب\", \"eta\":\"تاريخ ووقت الوصول\", \"cargo\":\"الحمولة\"}]. لا تضف أي نص أو شرح خارج الـ JSON.";
      const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": state.geminiApiKey
          },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: sys }] },
            contents: [ {
              parts: [
                { text: "استخرج بيانات المراكب من صورة البيرس بلان هذه:" },
                { inlineData: { mimeType: mimeType, data: base64Data } }
              ]
            } ]
          })
        }
      );
      
      const data = await response.json();
      if(!response.ok) throw new Error(data.error?.message || 'HTTP ' + response.status);
      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const cleanJson = rawText.replace(/```json|```/g, '').trim();
      const vesselsArray = JSON.parse(cleanJson);

      let count = 0;
      if(Array.isArray(vesselsArray)){
        vesselsArray.forEach(v => {
          if(v.name){
            const newV = {id: uid(), name: v.name, eta: v.eta || '', cargo: v.cargo || ''};
            state.vessels.push(newV);
            count++;
          }
        });
      }
      saveState(); renderTab();
      alert(`تم استخراج وإضافة ${count} مركب من الصورة بنجاح!`);
    } catch(err) {
      console.error(err);
      alert('حدث خطأ أثناء تحليل الصورة: ' + err.message);
      if(statusEl) statusEl.innerText = '';
    }
  };
  reader.readAsDataURL(file);
}

function handlePierExcelUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById('pierPasteText').value = e.target.result;
    parsePierText();
  };
  reader.readAsText(file);
}

function parsePierText(){
  const raw = document.getElementById('pierPasteText').value.trim();
  if(!raw){ alert('يرجى لصق نص أو اختيار ملف إكسيل أولاً'); return; }
  const lines = raw.split('\n');
  let count = 0;
  lines.forEach(line=>{
    const parts = line.split(/[\t,|;]+/).map(p=>p.trim()).filter(Boolean);
    if(parts.length >= 1){
      const name = parts[0];
      if(name.toLowerCase().includes('مركب') || name.toLowerCase().includes('vessel') || name.toLowerCase().includes('eta')) return;
      const eta = parts[1] || '';
      const cargo = parts[2] || '';
      state.vessels.push({id:uid(), name, eta, cargo});
      count++;
    }
  });
  saveState(); renderTab();
  alert(`تمت إضافة ${count} مركب تلقائياً إلى البيرس بلان.`);
}

  const newCargo = prompt('تعديل الحمولة:', v.cargo);

/* ===== Manual crane entry — a crane not linked to any specific vessel.
   Reuses the exact same "vessel with cranes" data model (so every rule
   already in place — duplicate-check, operators, equipment, hold, and
   the roster table row builder — keeps working with zero special-casing)
   by filing it under one shared pseudo-vessel called "بدون مركب". ===== */
const GENERAL_VESSEL_NAME = 'بدون مركب — أعمال عامة';
function getOrCreateGeneralVessel(date){
  const roster = getRoster(date);
  let gv = roster.vessels.find(v=>v.name===GENERAL_VESSEL_NAME);
  if(!gv){
    gv = {id:uid(), name:GENERAL_VESSEL_NAME, cranes:[], general:true};
    roster.vessels.push(gv);
    saveState();
  }
  return gv;
}
function addManualCrane(date){
  const gv = getOrCreateGeneralVessel(date);
  const numSel = document.getElementById(`manualCraneNum-${date}`);
  const holdSel = document.getElementById(`manualCraneHold-${date}`);
  const craneNumber = numSel ? numSel.value.trim() : '';
  const hold = holdSel ? holdSel.value.trim() : '';
  if(!craneNumber){ alert('من فضلك اختر رقم الونش أولاً'); return; }

  const roster = getRoster(date);
  const duplicate = roster.vessels.some(v=>(v.cranes||[]).some(c=>String(c.craneNumber)===String(craneNumber)));
  if(duplicate){ alert('هذا الونش تم اختياره بالفعل في تقسيمة اليوم ولا يمكن اختياره مرتين.'); renderTab(); return; }

  gv.cranes.push({ id:uid(), craneNumber, hold: hold || '-', operators:[], equipment:[] });
  log('روستر','إضافة ونش يدوي (بدون مركب)',null,{date,craneNumber});
  saveState(); renderTab();
}

function addVesselToRoster(date){
  const roster = getRoster(date);
  const pick = document.getElementById('pickVessel').value;
  const manual = document.getElementById('manualVessel').value.trim();
  let name;
  if(pick){ name = state.vessels.find(v=>v.id===pick).name; }
  else if(manual){ name = manual; }
  else { alert('اختر مركب أو اكتب اسمه'); return; }
  roster.vessels.push({id:uid(), name, cranes:[]});
  log('روستر','إضافة مركب للتخطيط',null,{date,name});
  saveState(); renderTab();
}

function getAssignedCraneNumbers(date, exceptVId='', exceptCrId=''){
  const roster = getRoster(date);
  const used = new Set();
  roster.vessels.forEach(v=>{
    (v.cranes||[]).forEach(c=>{
      if(v.id===exceptVId && c.id===exceptCrId) return;
      if(c.craneNumber && c.craneNumber!=='-') used.add(String(c.craneNumber));
    });
  });
  return used;
}
function getAvailableMasterCranes(date, exceptVId='', exceptCrId=''){
  const used = getAssignedCraneNumbers(date, exceptVId, exceptCrId);
  return (state.crew.cranes||[]).filter(c=>!used.has(String(c.number)));
}
function renderRosterVessels(date){
  const roster = getRoster(date);

              <option value="">-- اختر الونش --</option>

            </select>

function addCraneInline(date, vId){
  const numSelect = document.getElementById(`craneNum-${vId}`);
  const holdSelect = document.getElementById(`craneHold-${vId}`);
  if(!numSelect) return;
  const craneNumber = numSelect.value.trim();
  const hold = holdSelect ? holdSelect.value.trim() : '';
  if(!craneNumber){ alert('من فضلك اختر رقم الونش أولاً'); return; }

  const roster = getRoster(date);
  const rv = roster.vessels.find(v=>v.id===vId);
  if(!rv) return;

  const duplicate = roster.vessels.some(v=>(v.cranes||[]).some(c=>String(c.craneNumber)===String(craneNumber)));
  if(duplicate){
    alert('هذا الونش تم اختياره بالفعل في نفس تقسيمة اليوم ولا يمكن اختياره مرتين.');
    renderTab();
    return;
  }

  rv.cranes.push({
    id: uid(),
    craneNumber,
    hold: hold || '-',
    operators: [],
    equipment: []
  });
  saveState();
  renderTab();
}

function removeVesselFromRoster(date,vId){
  const roster = getRoster(date);
  if(!confirm('إزالة هذا المركب من التخطيط؟')) return;
  roster.vessels = roster.vessels.filter(v=>v.id!==vId);
  saveState(); renderTab();
}

function updateCraneField(date,vId,crId,field,value){
  const roster = getRoster(date);
  const cr = roster.vessels.find(v=>v.id===vId).cranes.find(c=>c.id===crId);
  const before = {...cr};
  cr[field] = value.trim()||'-';
  log('روستر','تعديل بيانات الونش',before,cr);
  saveState(); renderTab();
}

function getAssignedEquipmentIds(date, exceptVId='', exceptCrId=''){
  const roster=getRoster(date);
  const ids=new Set();
  roster.vessels.forEach(v=>(v.cranes||[]).forEach(c=>{
    if(v.id===exceptVId && c.id===exceptCrId) return;
    (c.equipment||[]).forEach(e=>{ if(e.refId) ids.add(e.refId); });
  }));
  return ids;
}
function getAssignedOperatorIds(date, exceptVId='', exceptCrId=''){
  const roster = getRoster(date);
  const ids = new Set();
  roster.vessels.forEach(v=>{
    (v.cranes||[]).forEach(c=>{
      if(v.id===exceptVId && c.id===exceptCrId) return;
      (c.operators||[]).forEach(id=>ids.add(id));
    });
  });
  (roster.teamAssignments||[]).forEach(team=>{
    (team.operatorIds||[]).forEach(id=>ids.add(id));
  });
  return ids;
}

function removeCrane(date,vId,crId){

  const rv = roster.vessels.find(v=>v.id===vId);

  rv.cranes = rv.cranes.filter(c=>c.id!==crId);
  saveState(); renderTab();
}

function buildRosterTableHTML(date){
  const roster = getRoster(date);
  const rows = [];
  const teams = roster.teamAssignments || [];
  const assignedRefs = new Set(teams.flatMap(t => t.craneRefs || []));
  let hasLoader = false, hasFork = false, hasHold = false, hasOps = false;

  // Individual crane rows: hide any crane that already belongs to a team.
  roster.vessels.forEach(rv=>{
    (rv.cranes||[]).forEach(cr=>{
      const ref = `${rv.id}|${cr.id}`;
      if(assignedRefs.has(ref)) return;

      const loaders = (cr.equipment||[]).filter(e=>e.type==='loader').map(e=>e.label.replace('لودر ',''));
      const forks = (cr.equipment||[]).filter(e=>e.type==='fork').map(e=>e.label.replace('شوكة ',''));
      const hold = cr.hold && cr.hold!=='-' ? String(cr.hold) : '';
      const ops = (cr.operators||[]).map(oid=>state.crew.operators.find(o=>o.id===oid))
        .filter(Boolean).filter(o=>!isOnLeave(o.name,date)).map(o=>o.name);

      const row = {
        kind:'individual',
        vessel: rv.name || '',
        teamName:'',
        loader: [...new Set(loaders)].join(' / '),
        fork: [...new Set(forks)].join(' / '),
        hold,
        ops: ops.join(' - '),
        crane: cr.craneNumber || ''
      };
      rows.push(row);
      hasLoader ||= !!row.loader;
      hasFork ||= !!row.fork;
      hasHold ||= !!row.hold;
      hasOps ||= !!row.ops;
    });
  });

  // A team is ONE roster row. Its member vessel names and crane numbers ARE
  // shown together in the same row (crane numbers joined with " + ").
  teams.forEach(team=>{
    const refs = (team.craneRefs||[]).map(ref=>{
      const [vId,crId] = String(ref).split('|');
      const v = roster.vessels.find(x=>x.id===vId);
      const c = v && (v.cranes||[]).find(x=>x.id===crId);
      return v && c ? {v,c} : null;
    }).filter(Boolean);
    if(!refs.length) return;

    const loaders=[], forks=[], holds=[];
    refs.forEach(({c})=>{
      (c.equipment||[]).forEach(e=>{
        if(e.type==='loader') loaders.push(e.label.replace('لودر ',''));
        if(e.type==='fork') forks.push(e.label.replace('شوكة ',''));
      });
      if(c.hold && c.hold!=='-') holds.push(String(c.hold));
    });

    const ops = (team.operatorIds||[])
      .map(id=>state.crew.operators.find(o=>o.id===id))
      .filter(Boolean)
      .filter(o=>!isOnLeave(o.name,date))
      .map(o=>o.name);

    const row = {
      kind:'team',
      teamId: team.id,
      vessel: [...new Set(refs.map(x=>x.v.name).filter(Boolean))].join(' / '),
      teamName: team.name || (currentLang()==='ar'?'فريق الوردية':'Shift Team'),
      loader:[...new Set(loaders)].join(' / '),
      fork:[...new Set(forks)].join(' / '),
      hold:[...new Set(holds)].join(' / '),
      ops:ops.join(' - '),
      crane:[...new Set(refs.map(x=>x.c.craneNumber).filter(Boolean))].join(' + ')
    };
    rows.push(row);
    hasLoader ||= !!row.loader;
    hasFork ||= !!row.fork;
    hasHold ||= !!row.hold;
    hasOps ||= !!row.ops;
  });

  if(!rows.length){
    return `<div class="empty muted">${currentLang()==='ar'?'لا توجد بيانات فعلية لعرضها في جدول الروستر':'There is no actual roster data to display'}</div>`;
  }

  const ar = currentLang()==='ar';
  const shiftLabel = ar ? 'الوردية الثالثة' : 'Third Shift';
  const vesselHead = ar ? 'المركب' : 'Vessel';
  const teamHead = ar ? 'الفريق / الوردية' : 'Team / Shift';
  const loaderHead = 'Loader';
  const forkHead = 'Forklift';
  const holdHead = ar ? 'العنبر' : 'Hold';
  const opHead = ar ? 'الونّاشين' : 'Crane Operators';

  const craneHead = ar ? 'الونش' : 'Crane';

  // Do NOT create empty columns. Loader/Forklift/Hold/Operators appear only
  // when at least one real row contains data. Crane is always meaningful.
  const columns = [
    {key:'identity', label:vesselHead, always:true},
    {key:'crane', label:craneHead, always:true},
    {key:'loader', label:loaderHead, enabled:hasLoader},
    {key:'fork', label:forkHead, enabled:hasFork},
    {key:'hold', label:holdHead, enabled:hasHold},
    {key:'ops', label:opHead, enabled:hasOps}
  ].filter(c=>c.always || c.enabled);

  return `
  <div class="roster-export-shell">
    <table class="rt-table">
      <thead>
        <tr>
          <th class="rt-team" rowspan="2">${shiftLabel}</th>
          <th class="rt-title" colspan="${columns.length}">ROSTER</th>
        </tr>
        <tr>
          ${columns.map(c=>`<th>${c.label}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${rows.map((r,i)=>`
          <tr class="${r.kind==='team'?'team-row':''}">
            ${i===0 ? `<td class="rt-team" rowspan="${rows.length}">${shiftLabel}</td>` : ''}
            ${columns.map(c=>{
              const value = c.key==='identity' ? r.vessel : r[c.key];
              return `<td>${esc(value||'')}</td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function addTeamAssignment(date){
  const roster=getRoster(date);
  const name=(document.getElementById(`teamName-${date}`)?.value||'').trim()||'تقسيمة فريق';
  const craneRefs=[...document.querySelectorAll(`input[name="teamCrane-${date}"]:checked`)].map(x=>x.value);
  const operatorIds=[...document.querySelectorAll(`input[name="teamOperator-${date}"]:checked`)].map(x=>x.value);
  if(!craneRefs.length){alert('اختر ونشاً واحداً على الأقل.');return;}
  if(!operatorIds.length){alert('اختر ونّاشاً واحداً على الأقل.');return;}
  const assigned=getAssignedOperatorIds(date);
  if(operatorIds.some(id=>assigned.has(id))){
    alert('أحد الونّاشين تم تعيينه بالفعل على ونش آخر أو تقسيمة فريق أخرى.'); renderTab(); return;
  }
  const team={id:uid(),name,craneRefs,operatorIds};
  roster.teamAssignments.push(team);
  log('روستر','إضافة تقسيمة جماعية',null,{date,team});
  saveState(); renderTab();
}
function deleteTeamAssignment(date,id){
  const roster=getRoster(date);
  roster.teamAssignments=roster.teamAssignments.filter(t=>t.id!==id);

}

function assignOperatorText(date, vId, crId) {
  const input = document.getElementById(`opInput-${crId}`);
  if(!input) return;
  const opName = input.value.trim();
  if(!opName) return;

  const op = state.crew.operators.find(o => o.name === opName);
  if(!op) return;
  if(isOnLeave(op.name,date)){
    alert('هذا المشغل لديه إجازة / مأمورية / كورس في هذا اليوم ولا يمكن تعيينه.');
    renderTab(); return;
  }

  const assigned = getAssignedOperatorIds(date, vId, crId);
  if(assigned.has(op.id)){
    alert('هذا المشغل معين بالفعل على ونش آخر أو داخل تقسيمة فريق أخرى.');
    renderTab(); return;
  }

  const roster = getRoster(date);
  const cr = roster.vessels.find(v=>v.id===vId).cranes.find(c=>c.id===crId);
  if(!cr.operators.includes(op.id)) {
    cr.operators.push(op.id);
    log('روستر', 'تعيين ونّاش', null, {vId, crId, opName});
  }
  input.value = '';
  saveState(); renderTab();
}

function unassignOperator(date,vId,crId,opId){
  const roster = getRoster(date);
  const cr = roster.vessels.find(v=>v.id===vId).cranes.find(c=>c.id===crId);
  cr.operators = cr.operators.filter(x=>x!==opId);
  saveState(); renderTab();
}

function assignEquipFromSelect(date,vId,crId){
  const sel = document.getElementById(`eqSel-${crId}`);
  const val = sel ? sel.value : '';
  if(!val) return;
  const [type,id,number] = val.split(':');
  const roster = getRoster(date);
  const cr = roster.vessels.find(v=>v.id===vId).cranes.find(c=>c.id===crId);
  if(cr.equipment.some(e=>e.refId===id)){
    renderTab(); return;
  }
  cr.equipment.push({label:(type==='loader'?'لودر ':'شوكة ')+number, refId:id, type});
  saveState(); renderTab();
}

function removeEquipFromCrane(date,vId,crId,idx){
  const roster = getRoster(date);
  const cr = roster.vessels.find(v=>v.id===vId).cranes.find(c=>c.id===crId);
  cr.equipment.splice(idx,1);
  saveState(); renderTab();
}

/* ===================== AI ROSTER GENERATOR ===================== */
function aiGenerateRoster(date){
  try {
    if (typeof getRoster !== 'function') return;
    const roster = getRoster(date);
    if(!roster || !roster.vessels || !roster.vessels.length){ alert('أضف مركب واحد على الأقل أولاً'); return; }
    let cranes = [];
    roster.vessels.forEach(v=> v.cranes && v.cranes.forEach(c=> cranes.push(c)) );
    if(!cranes.length){ alert('أضف أوناش للمركب أولاً'); return; }

    const available = (state && state.crew && state.crew.operators) ? state.crew.operators.filter(o=>!isOnLeave(o.name,date)) : [];
    const byRating = {A:[],B:[],C:[]};
    available.forEach(o=> {
      let r = o.rating || 'A';
      if(byRating[r]) byRating[r].push(o.id || o.name);
    });
    Object.values(byRating).forEach(arr=>arr.sort(()=>Math.random()-0.5));

    cranes.forEach(c=>c.operators=[]);
    const order = ['A','B','C'];
    let ratingQueues = {A:[...byRating.A], B:[...byRating.B], C:[...byRating.C]};
    let craneIdx=0;
    let guard=0;
    while((ratingQueues.A.length||ratingQueues.B.length||ratingQueues.C.length) && guard<2000){
      guard++;
      const crane = cranes[craneIdx % cranes.length];
      let assigned=false;
      for(const r of order){
        if(ratingQueues[r].length){
          const opId = ratingQueues[r].shift();
          crane.operators.push(opId);
          assigned=true;
          break;
        }
      }
      craneIdx++;
      if(!assigned) break;
    }
    if(typeof log === 'function') log('روستر','توليد تلقائي بالذكاء الاصطناعي',null,{date, cranesCount:cranes.length});
    if(typeof saveState === 'function') saveState(); 
    if(typeof renderTab === 'function') renderTab();
    alert('تم توليد توزيع الوناشين تلقائياً بالتوازن بين التصنيفات.');
  } catch(e) {
    console.error("Error in aiGenerateRoster:", e);
  }
}

/* ===================== ROTATION CALENDAR (متوافق حتى 2050 بناءً على نطاق 3 أشهر يوليو-سبتمبر 2026) ===================== */
function getShiftTypeForDate(dateObj, shiftNum) {
    if (!(dateObj instanceof Date) || isNaN(dateObj.getTime())) {
        return 'O';
    }

    const currentDate = new Date(dateObj);
    currentDate.setHours(0, 0, 0, 0);

    const referenceDate = new Date(2026, 6, 1);
    referenceDate.setHours(0, 0, 0, 0);

    const diffDays = Math.floor((currentDate.getTime() - referenceDate.getTime()) / 86400000);

    // النمط المتسلسل المعتمد بناءً على الـ 3 أشهر الأولى (يوليو، أغسطس، سبتمبر 2026)
    const pattern = ['D', 'D', 'N', 'N', 'O', 'O', 'O', 'O'];

    const offsets = {
        1: 0,
        2: 4,
        3: 6,
        4: 2 
    };

    const offset = offsets[shiftNum] ?? 0;
    let index = (diffDays + offset) % 8;

    if (index < 0) {
        index += 8;
    }

    return pattern[index];
}

function renderMonthlyCalendar(year, month, holidays){

    </td>`;

      const currDate = new Date(year, month, d);
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const code = getShiftTypeForDate(currDate, sNum);
      let cellClass = 'cal-shift-O';

function addHoldPlanEntry(){
  const pick = document.getElementById('hpPickVessel').value;
  const manual = document.getElementById('hpManualVessel').value.trim();
  const holdsCount = Number(document.getElementById('hpHoldsCount').value)||9;
  const opType = document.getElementById('hpOpType').value || 'discharge';
  let name;
  if(pick){ name = state.vessels.find(v=>v.id===pick).name; }
  else if(manual){ name = manual; }
  else { alert('اختر مركب أو اكتب اسمه'); return; }
  const holds = Array.from({length:holdsCount}, (_,i)=>({index:i+1, craneNumber:'', loaderNumber:'', radioChannel:'', capacity:'', qty:'', done:false}));
  state.holdPlans.push({id:uid(), name, holdsCount, opType, date:todayStr(), holds});
  log('مخطط عنابر','إضافة مركب',null,{name,holdsCount,opType});
  saveState(); renderTab();
}
function reassignCrane(planId, craneNumber, fromHoldIndex, toHoldIndex){
  const p = state.holdPlans.find(x=>x.id===planId);
  if(!p) return;
  toHoldIndex = Number(toHoldIndex);
  if(!toHoldIndex){ alert('اختر العنبر المطلوب نقل الونش إليه'); return; }
  const from = p.holds.find(h=>h.index===Number(fromHoldIndex));
  const to = p.holds.find(h=>h.index===toHoldIndex);
  if(!from || !to) return;
  if(to.craneNumber){ if(!confirm(`عنبر ${to.index} فيه ونش ${to.craneNumber} بالفعل، عايز تستبدله؟`)) return; }
  from.craneNumber = '';
  to.craneNumber = craneNumber;
  log('مخطط عنابر','نقل ونش', {hold:from.index}, {hold:to.index, crane:craneNumber});
  saveState(); renderTab();
}

function removeHoldPlanEntry(id){
  const p = state.holdPlans.find(x=>x.id===id);
  if(!confirm('إزالة مخطط هذا المركب؟')) return;
  state.holdPlans = state.holdPlans.filter(x=>x.id!==id);
  log('مخطط عنابر','حذف مركب',p,null);
  saveState(); renderTab();
}

function updateHoldPlanCount(planId, newCount){
  const p = state.holdPlans.find(x=>x.id===planId);
  if(!p) return;
  newCount = Number(newCount)||p.holdsCount;
  const oldHolds = p.holds || [];
  const newHolds = [];
  for(let i=1;i<=newCount;i++){
    const existing = oldHolds.find(h=>h.index===i);
    newHolds.push(existing || {index:i, craneNumber:'', loaderNumber:'', radioChannel:'', capacity:'', qty:'', done:false});
  }
  p.holds = newHolds;
  p.holdsCount = newCount;
  saveState(); renderTab();
}

function updateHoldField(planId, holdIndex, field, value){
  const p = state.holdPlans.find(x=>x.id===planId);
  if(!p) return;
  const h = p.holds.find(x=>x.index===holdIndex);
  if(!h) return;
  h[field] = value;
  saveState();
  const svgBox = document.getElementById(`holdPlanSvg-${planId}`);
  if(svgBox) svgBox.innerHTML = buildVesselSVG(p);
}

function toggleHoldDone(planId, holdIndex){
  const p = state.holdPlans.find(x=>x.id===planId);
  if(!p) return;
  const h = p.holds.find(x=>x.index===holdIndex);
  if(!h) return;
  h.done = !h.done;
  saveState(); renderTab();
}
