/* Builds a schematic side-view of the vessel with N holds, numbered 1 (bow, right)
   through N (stern, left). Each hold optionally shows: a crane icon + number above it,
   a loader icon + number inside it, a remaining-quantity label, and a "done" fill color.
   Holds with nothing entered stay empty — no placeholder data is ever drawn. */
function craneIconSVG(cx, baseY, number){
  const peakY = baseY - 122;
  const badgeY = baseY - 34;
  const bucketY = baseY - 92;
  return `
  <g>
    <rect x="${cx-21}" y="${baseY-16}" width="42" height="16" rx="2.5" fill="#22314a" stroke="#8fa3c2" stroke-width="1.2"/>
    <line x1="${cx-18}" y1="${baseY-16}" x2="${cx}" y2="${peakY}" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx+18}" y1="${baseY-16}" x2="${cx}" y2="${peakY}" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${baseY-16}" x2="${cx}" y2="${peakY}" stroke="#64748b" stroke-width="1.6"/>
    <circle cx="${cx}" cy="${peakY}" r="4.5" fill="#0b1220" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="${cx-4}" y1="${peakY+3}" x2="${cx-11}" y2="${bucketY-8}" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="${cx+4}" y1="${peakY+3}" x2="${cx+11}" y2="${bucketY-8}" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M ${cx-13},${bucketY-8} Q ${cx},${bucketY+7} ${cx+13},${bucketY-8} Q ${cx},${bucketY-18} ${cx-13},${bucketY-8} Z" fill="#3b4658" stroke="#cbd5e1" stroke-width="1.1"/>
    <circle cx="${cx}" cy="${badgeY}" r="15" fill="#0ea5e9" stroke="#e6f6ff" stroke-width="2"/>
    <text x="${cx}" y="${badgeY+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#0b1220">${esc(number)}</text>
  </g>`;
}

function loaderIconSVG(cx, cy, number){
  return `
  <g>
    <rect x="${cx-13}" y="${cy-32}" width="17" height="15" rx="2" fill="#f5c542" stroke="#0b1220" stroke-width="1.2"/>
    <rect x="${cx-15}" y="${cy-8}" width="46" height="19" rx="4" fill="#f5c542" stroke="#0b1220" stroke-width="1.4"/>
    <line x1="${cx+31}" y1="${cy-2}" x2="${cx+48}" y2="${cy-18}" stroke="#3b4658" stroke-width="3" stroke-linecap="round"/>
    <path d="M ${cx+44},${cy-20} Q ${cx+58},${cy-22} ${cx+56},${cy-10} Q ${cx+50},${cy-8} ${cx+44},${cy-14} Z" fill="#7a8598" stroke="#0b1220" stroke-width="1.1"/>
    <circle cx="${cx-6}" cy="${cy+13}" r="7.5" fill="#1a2130" stroke="#9ca3af" stroke-width="1.2"/>
    <circle cx="${cx+18}" cy="${cy+13}" r="7.5" fill="#1a2130" stroke="#9ca3af" stroke-width="1.2"/>
    <circle cx="${cx+6}" cy="${cy+34}" r="13" fill="#f5c542" stroke="#0b1220" stroke-width="1.4"/>
    <text x="${cx+6}" y="${cy+39}" text-anchor="middle" font-size="12" font-weight="800" fill="#0b1220">${esc(number)}</text>
  </g>`;
}

function cargoPileSVG(cellX0, cellX1, topY, bottomY, ratio){
  if(ratio<=0) return '';
  const innerUsable = (bottomY-topY) - 58;
  const fillHeight = Math.max(8, innerUsable*Math.min(1,ratio));
  const baseline = bottomY-8;
  const peakY = baseline - fillHeight;
  const x0 = cellX0+10, x1 = cellX1-10, w = x1-x0;
  return `<path d="M ${x0},${baseline} Q ${x0+w*0.22},${peakY-6} ${x0+w*0.5},${peakY} Q ${x0+w*0.78},${peakY-6} ${x1},${baseline} Z" fill="#d99a44" fill-opacity="0.5" stroke="#e8b968" stroke-opacity="0.85" stroke-width="1.3"/>`;
}

function buildVesselSVG(plan){
  const ar = currentLang()==='ar';
  const N = plan.holdsCount;
  const holdW = 130;
  const superW = 155;
  const bowLen = 105;
  const topY = 200, bottomY = 400, midY = (topY+bottomY)/2;
  const hullX0 = superW;
  const hullX1 = hullX0 + N*holdW;
  const bowTipX = hullX1 + bowLen;
  const totalW = bowTipX + 50;
  const totalH = 480;
  const wlY = bottomY + 18; // waterline

  // Smooth raked bow (bezier) + rounded stern quarter, instead of straight angles.
  const hullPath = `
    M ${hullX0},${topY}
    L ${hullX1},${topY}
    C ${hullX1+bowLen*0.6},${topY} ${hullX1+bowLen*0.98},${topY+(midY-topY)*0.5} ${bowTipX},${midY}
    C ${hullX1+bowLen*0.98},${midY+(bottomY-midY)*0.5} ${hullX1+bowLen*0.6},${bottomY} ${hullX1},${bottomY}
    L ${hullX0},${bottomY}
    Q ${hullX0-40},${bottomY} ${hullX0-40},${bottomY-42}
    L ${hullX0-40},${topY+32}
    Q ${hullX0-40},${topY} ${hullX0},${topY}
    Z`;

  const dividers = [];
  for(let i=1;i<N;i++){
    const x = hullX0 + i*holdW;
    dividers.push(`<line x1="${x}" y1="${topY}" x2="${x}" y2="${bottomY}" stroke="#334155" stroke-width="1.5"/>`);
  }

  const holdBodies = [];
  const craneLayer = [];

  plan.holds.forEach(h=>{
    // Hold 1 is at the bow (rightmost), hold N is nearest the superstructure (leftmost).
    const cellX0 = hullX0 + (N - h.index) * holdW;
    const cellX1 = cellX0 + holdW;
    const cellCx = (cellX0+cellX1)/2;
    const fill = h.done ? '#123527' : 'url(#holdGrad-'+plan.id+')';

    const capacity = Number(h.capacity)||0;
    const qty = Number(h.qty)||0;
    // If a capacity was entered, show the pile proportional to it. Otherwise,
    // as long as a quantity was typed, still show a pile at a sensible default
    // height just to indicate "there is cargo here" — never nothing.
    const ratio = qty>0 ? (capacity>0 ? Math.min(1, qty/capacity) : 0.55) : 0;
    const cargoPile = cargoPileSVG(cellX0, cellX1, topY, bottomY, ratio);

    const loaderIcon = h.loaderNumber ? loaderIconSVG(cellCx-16, topY+95, h.loaderNumber) : '';

    let qtyText = '';
    if(qty>0 && capacity>0){
      qtyText = `<text x="${cellCx}" y="${bottomY-28}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">~${qty.toLocaleString('en-US')} / ${capacity.toLocaleString('en-US')} ${ar?'طن':'t'}</text>
        <text x="${cellCx}" y="${bottomY-13}" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8fa3c2">${ar?'(كمية تقريبية)':'(approx. quantity)'}</text>`;
    } else if(qty>0){
      qtyText = `<text x="${cellCx}" y="${bottomY-28}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">~${qty.toLocaleString('en-US')} ${ar?'طن':'t'}</text>
        <text x="${cellCx}" y="${bottomY-13}" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8fa3c2">${ar?'(كمية تقريبية)':'(approx. quantity)'}</text>`;
    }

    const radioText = h.radioChannel ? `<text x="${cellCx}" y="${topY+38}" text-anchor="middle" font-size="10" fill="#8fa3c2">📻 ${ar?'موجه الراديو':'Radio Ch.'}: ${esc(h.radioChannel)}</text>` : '';
    const doneText = h.done ? `<text x="${cellCx}" y="${topY+54}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#34d399">${ar?'تم الانتهاء من العنبر':'Hold Completed'}</text>` : '';

    holdBodies.push(`
      <rect x="${cellX0}" y="${topY}" width="${holdW}" height="${bottomY-topY}" fill="${fill}" stroke="${h.done?'#1f8f5c':'#1e293b'}" stroke-width="1"/>
      <rect x="${cellX0+7}" y="${topY+7}" width="${holdW-14}" height="${(bottomY-topY)-14}" fill="none" stroke="#33415580" stroke-width="1" stroke-dasharray="3 4"/>
      ${cargoPile}
      <text x="${cellCx}" y="${topY+22}" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">HOLD ${h.index}</text>
      ${radioText}
      ${doneText}
      ${loaderIcon}
      ${qtyText}
    `);

    // Cranes stand ABOVE the deck line, so they must be drawn outside the
    // hull's clip-path — otherwise they get cut off at the top edge.
    if(h.craneNumber){
      craneLayer.push(craneIconSVG(cellCx, topY, h.craneNumber));
    }
  });

  // Bollards along the deck edge at each hold divider, for a more engineered deck look.
  const bollards = [];
  for(let i=0;i<=N;i++){
    const x = hullX0 + i*holdW;
    if(x>hullX0+4 && x<hullX1-4) bollards.push(`<circle cx="${x}" cy="${topY-4}" r="2.6" fill="#94a3b8"/>`);
  }

  // Simple wave ripples along the waterline for a finished, professional look.
  let waveD = `M 0,${wlY}`;
  for(let x=0; x<=totalW; x+=26){ waveD += ` q 13,${x%52===0?7:-7} 26,0`; }

  return `
  <svg viewBox="0 0 ${totalW} ${totalH}" width="100%" style="max-width:${totalW}px;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hullGrad-${plan.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3d4c66"/>
        <stop offset="55%" stop-color="#25314a"/>
        <stop offset="100%" stop-color="#131b2c"/>
      </linearGradient>
      <linearGradient id="holdGrad-${plan.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#16233a"/>
        <stop offset="100%" stop-color="#0d1626"/>
      </linearGradient>
      <linearGradient id="superGrad-${plan.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2c3a54"/>
        <stop offset="100%" stop-color="#182236"/>
      </linearGradient>
      <filter id="shadow-${plan.id}" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
      </filter>
    </defs>

    <rect x="0" y="0" width="${totalW}" height="${totalH}" fill="#0b1220"/>
    <rect x="16" y="8" width="${totalW-32}" height="34" rx="8" fill="#111a2c" stroke="#22314a" stroke-width="1"/>
    <text x="${totalW/2}" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#e8b93f">${esc(plan.name)} — ${esc(plan.date||todayStr())}</text>

    <g filter="url(#shadow-${plan.id})">
      <path d="${hullPath}" fill="url(#hullGrad-${plan.id})"/>
      <clipPath id="hullClip-${plan.id}"><path d="${hullPath}"/></clipPath>
      <g clip-path="url(#hullClip-${plan.id})">${holdBodies.join('')}</g>
      <path d="${hullPath}" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
      ${dividers.join('')}
      ${bollards.join('')}

      <!-- bow hawsepipe / anchor detail -->
      <circle cx="${hullX1+bowLen*0.42}" cy="${midY-24}" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/>

      <!-- superstructure block -->
      <rect x="${hullX0-22}" y="${topY-92}" width="86" height="92" rx="4" fill="url(#superGrad-${plan.id})" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="${hullX0-10}" y="${topY-78}" width="14" height="12" rx="2" fill="#f4c542" fill-opacity="0.85" stroke="#0b1220" stroke-width="1"/>
      <rect x="${hullX0+9}" y="${topY-78}" width="14" height="12" rx="2" fill="#f4c542" fill-opacity="0.85" stroke="#0b1220" stroke-width="1"/>
      <rect x="${hullX0-10}" y="${topY-58}" width="14" height="12" rx="2" fill="#f4c542" fill-opacity="0.55" stroke="#0b1220" stroke-width="1"/>
      <rect x="${hullX0+9}" y="${topY-58}" width="14" height="12" rx="2" fill="#f4c542" fill-opacity="0.55" stroke="#0b1220" stroke-width="1"/>

      <!-- funnel with brand-accent stripe -->
      <rect x="${hullX0+40}" y="${topY-118}" width="22" height="30" rx="3" fill="#22314a" stroke="#cbd5e1" stroke-width="1.4"/>
      <rect x="${hullX0+40}" y="${topY-110}" width="22" height="7" fill="#e8b93f"/>

      <!-- mast with radar -->
      <line x1="${hullX0+18}" y1="${topY-92}" x2="${hullX0+18}" y2="${topY-128}" stroke="#cbd5e1" stroke-width="2.4"/>
      <line x1="${hullX0+4}" y1="${topY-118}" x2="${hullX0+32}" y2="${topY-118}" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="${hullX0+18}" cy="${topY-128}" rx="6" ry="3" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    </g>

    <!-- waterline -->
    <path d="${waveD}" fill="none" stroke="#2563eb" stroke-opacity="0.55" stroke-width="2.4"/>
    <rect x="0" y="${wlY+4}" width="${totalW}" height="${totalH-wlY-4}" fill="#0d1b33" fill-opacity="0.35"/>

    ${craneLayer.join('')}
  </svg>`;
}

function switchKPISubTab(id){ kpiSubTab = id; renderTab(); }
function findHoldPlanByVesselName(name){
  if(!name) return null;
  const n = String(name).trim().toLowerCase();
  if(!n) return null;
  const matches = (state.holdPlans||[]).filter(p=>String(p.name).trim().toLowerCase()===n);
  return matches.length ? matches[matches.length-1] : null; // most recently added plan for that vessel name
}
function currentKPIVesselName(){
  if(kpiDraft.vesselName && kpiDraft.vesselName.trim()) return kpiDraft.vesselName.trim();
  if(kpiDraft.vesselId){ const v = state.vessels.find(x=>x.id===kpiDraft.vesselId); if(v) return v.name; }
  return '';
}

          <div class="field" style="grid-column:1/-1;"><label>${ar?'ملاحظة':'Note'}</label><input value="${esc(d.note||'')}" oninput="updateKPIDelayRow(${i},'note',this.value)"></div>

  <div class="card" style="margin-top:20px;">
    <h2>📋 ${ar?'آخر السجلات':'Recent logs'}</h2>
    ${renderKPIVesselLogList()}

}
function addKPICraneRow(){ kpiDraft.craneEntries.push({id:uid(), craneId:'', operatorId:'', hours:0, moves:0, tons:0}); renderTab(); }
function updateKPICraneRow(i, field, val){
  const e = kpiDraft.craneEntries[i]; if(!e) return;
  e[field] = (field==='hours'||field==='moves'||field==='tons') ? parseFloat(val)||0 : val;
  renderTab();
}
function removeKPICraneRow(i){ kpiDraft.craneEntries.splice(i,1); renderTab(); }
function bumpKPICraneHours(i, delta){
  const e = kpiDraft.craneEntries[i]; if(!e) return;
  const v = Math.max(0, +(( (e.hours||0) + delta ).toFixed(1)));
  updateKPICraneRow(i,'hours', v);
}
function setKPICraneHours(i, val){ updateKPICraneRow(i,'hours', val); }
function bumpNumberInput(id, delta, min){
  const el = document.getElementById(id); if(!el) return;
  const ar = currentLang()==='ar';
  let v = Math.max(min!=null?min:0, (parseFloat(el.value)||0) + delta);
  el.value = v;
  const lbl = document.getElementById(id+'Label');
  if(lbl) lbl.textContent = `${v} ${ar?'د':'min'}`;
}
function addKPIDelayRow(){ kpiDraft.delays.push({id:uid(), code:'other', minutes:0, note:''}); renderTab(); }
function updateKPIDelayRow(i, field, val){
  const d = kpiDraft.delays[i]; if(!d) return;
  d[field] = field==='minutes' ? (parseFloat(val)||0) : val;
  renderTab();
}
function removeKPIDelayRow(i){ kpiDraft.delays.splice(i,1); renderTab(); }

function saveKPIVesselLog(){
  ensureKPI(); ensureYardData();
  const ar = currentLang()==='ar';
  const cranes = state.crew.cranes||[], operators = state.crew.operators||[];
  const vesselId = document.getElementById('kpiVessel').value;
  const vesselNameManual = document.getElementById('kpiVesselName').value.trim();

function destroyKPICharts(){
  Object.values(kpiChartInstances).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  kpiChartInstances = {};

function renderKPICharts(){
  if(kpiSubTab!=='dashboard' || typeof Chart==='undefined') return;
  ensureKPI(); ensureYardData();
  destroyKPICharts();
  const ar = currentLang()==='ar';
  const logs = state.kpi.vesselLogs||[];

  // Crane performance
  const craneAgg = {};
  logs.forEach(l=> l.craneEntries.forEach(e=>{
    const key = e.craneName || e.craneId || '?';
    if(!craneAgg[key]) craneAgg[key] = {tons:0, hours:0};
    craneAgg[key].tons += e.tons||0; craneAgg[key].hours += e.hours||0;
  }));
  const craneLabels = Object.keys(craneAgg);
  const craneRates = craneLabels.map(k=> craneAgg[k].hours>0 ? +(craneAgg[k].tons/craneAgg[k].hours).toFixed(2) : 0);
  const c1 = document.getElementById('chartCranePerf');
  if(c1) kpiChartInstances.c1 = new Chart(c1, {
    type:'bar',
    data:{ labels: craneLabels.length?craneLabels:[ar?'لا بيانات':'No data'], datasets:[{label: ar?'طن/ساعة':'tons/hr', data: craneRates.length?craneRates:[0], backgroundColor:'#0A84FF'}] },
    options:{ responsive:true, plugins:{legend:{display:false}} }
  });

  // Discharge rate over days
  const dayAgg = {};
  logs.forEach(l=>{
    if(!dayAgg[l.date]) dayAgg[l.date] = {tons:0, hours:0};
    l.craneEntries.forEach(e=>{ dayAgg[l.date].tons += e.tons||0; dayAgg[l.date].hours += e.hours||0; });
  });
  const days = Object.keys(dayAgg).sort();
  const dayRates = days.map(d=> dayAgg[d].hours>0 ? +(dayAgg[d].tons/dayAgg[d].hours).toFixed(2) : 0);
  const c2 = document.getElementById('chartDischargeRate');
  if(c2) kpiChartInstances.c2 = new Chart(c2, {
    type:'line',
    data:{ labels: days.length?days:[ar?'لا بيانات':'No data'], datasets:[{label: ar?'طن/ساعة':'tons/hr', data: dayRates.length?dayRates:[0], borderColor:'#FFD166', backgroundColor:'rgba(255,209,102,.25)', tension:.3, fill:true}] },
    options:{ responsive:true, plugins:{legend:{display:false}} }
  });

  // Downtime by crane
  const downAgg = {};
  (state.kpi.breakdowns||[]).forEach(b=>{
    const key = b.craneName || b.craneId || '?';
    downAgg[key] = (downAgg[key]||0) + (b.downtimeMinutes||0);
  });
  const downLabels = Object.keys(downAgg);
  const downVals = downLabels.map(k=>downAgg[k]);
  const c3 = document.getElementById('chartDowntime');
  if(c3) kpiChartInstances.c3 = new Chart(c3, {
    type:'bar',
    data:{ labels: downLabels.length?downLabels:[ar?'لا بيانات':'No data'], datasets:[{label: ar?'دقائق التوقف':'downtime (min)', data: downVals.length?downVals:[0], backgroundColor:'#FF5555'}] },
    options:{ responsive:true, plugins:{legend:{display:false}}, indexAxis:'y' }
  });
}

/* ---------- Reports & Export ---------- */
function periodStartDate(period){
  const now = new Date();
  if(period==='12h') return new Date(now.getTime()-12*3600*1000);
  if(period==='24h') return new Date(now.getTime()-24*3600*1000);
  if(period==='week') return new Date(now.getTime()-7*24*3600*1000);
  if(period==='month') return new Date(now.getFullYear(), now.getMonth(), 1);
  if(period==='year') return new Date(now.getFullYear(), 0, 1);
  return new Date(0);
}
function filterKPIByPeriod(){
  ensureKPI(); ensureYardData();
  const start = periodStartDate(kpiReportPeriod);
  const inRange = (iso)=> new Date(iso) >= start;
  return {
    vesselLogs: (state.kpi.vesselLogs||[]).filter(l=>inRange(l.createdAt)),
    incidents: (state.kpi.incidents||[]).filter(i=>inRange(i.createdAt)),
    breakdowns: (state.kpi.breakdowns||[]).filter(b=>inRange(b.createdAt))
  };
}

/* SheetJS's free build can't embed a raster logo image inside a worksheet, so as
   the clearest professional substitute every sheet gets a merged brand title row
   (kept in its own row above the data, never overlapping a data cell). */
function sheetWithBrandHeader(rows, ar){
  const ws = XLSX.utils.json_to_sheet(rows, {origin:'A3'});
  XLSX.utils.sheet_add_aoa(ws, [
    [ar?'AF Logic — جناح عمليات الموانئ والورديات':'AF Logic — Port Operations & Roster Suite'],
    [`${ar?'تاريخ التصدير':'Exported'}: ${new Date().toLocaleString('en-GB')}`]
  ], {origin:'A1'});
  const colCount = rows.length ? Object.keys(rows[0]).length : 1;
  ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:Math.max(0,colCount-1)}}, {s:{r:1,c:0}, e:{r:1,c:Math.max(0,colCount-1)}}];
  return ws;
}
function exportKPIExcel(){
  const ar = currentLang()==='ar';
  if(typeof XLSX==='undefined'){ alert(ar?'تعذر تحميل مكتبة التصدير':'Export library failed to load'); return; }
  const {vesselLogs, incidents, breakdowns} = filterKPIByPeriod();
  const wb = XLSX.utils.book_new();

  const logRows = [];
  vesselLogs.forEach(l=>{
    if(!l.craneEntries.length){
      logRows.push({Date:l.date, Shift:l.shiftName, Vessel:l.vesselName, Cargo_Tons:l.totalCargoTons, Weather:l.weather, Wind_kmh:l.windSpeed, Crane:'', Operator:'', Hours:'', Moves:'', Tons:'', Tons_per_hr:''});
    } else {
      l.craneEntries.forEach(e=>{
        logRows.push({Date:l.date, Shift:l.shiftName, Vessel:l.vesselName, Cargo_Tons:l.totalCargoTons, Weather:l.weather, Wind_kmh:l.windSpeed,
          Crane:e.craneName, Operator:e.operatorName, Hours:e.hours, Moves:e.moves, Tons:e.tons, Tons_per_hr: e.hours>0?+(e.tons/e.hours).toFixed(2):0});
      });
    }
  });
  XLSX.utils.book_append_sheet(wb, sheetWithBrandHeader(logRows.length?logRows:[{Date:'',Shift:'',Vessel:'',Cargo_Tons:'',Weather:'',Wind_kmh:'',Crane:'',Operator:'',Hours:'',Moves:'',Tons:'',Tons_per_hr:''}], ar), 'Vessel Shift Logs');

  const delayRows = [];
  vesselLogs.forEach(l=> (l.delays||[]).forEach(d=> delayRows.push({Date:l.date, Vessel:l.vesselName, Reason:d.code, Minutes:d.minutes, Note:d.note})));
  XLSX.utils.book_append_sheet(wb, sheetWithBrandHeader(delayRows.length?delayRows:[{Date:'',Vessel:'',Reason:'',Minutes:'',Note:''}], ar), 'Delays');

  XLSX.utils.book_append_sheet(wb, sheetWithBrandHeader(incidents.length?incidents.map(i=>({Date:i.date,Type:i.type,Severity:i.severity,Crane:i.craneName,Description:i.description,By:i.user})):[{Date:'',Type:'',Severity:'',Crane:'',Description:'',By:''}], ar), 'HSE Incidents');

  XLSX.utils.book_append_sheet(wb, sheetWithBrandHeader(breakdowns.length?breakdowns.map(b=>({Date:b.date,Crane:b.craneName,Type:b.type,Downtime_min:b.downtimeMinutes,Planned_min:b.plannedMinutes,OEE_pct: b.plannedMinutes>0?+Math.max(0,((b.plannedMinutes-b.downtimeMinutes)/b.plannedMinutes)*100).toFixed(1):100, Note:b.note})):[{Date:'',Crane:'',Type:'',Downtime_min:'',Planned_min:'',OEE_pct:'',Note:''}], ar), 'Breakdowns & OEE');

  XLSX.writeFile(wb, `KPI_Report_${kpiReportPeriod}_${todayStr()}.xlsx`);
}

function saveYardTransaction(){
  ensureYardData();
  const ar = currentLang()==='ar';
  const yards = state.yardData.yards;
  const direction = document.getElementById('yardDirection').value;
  const fromId = document.getElementById('yardFrom').value;
  const toEl = document.getElementById('yardTo');
  const toId = toEl ? toEl.value : '';
  const qty = parseFloat(document.getElementById('yardQty').value)||0;
  if(qty<=0){ alert(ar?'من فضلك أدخل كمية أكبر من صفر':'Please enter a quantity greater than zero'); return; }
  if((direction==='transfer') && toId===fromId){ alert(ar?'اختر يارد مختلف للنقل إليه':'Pick a different destination yard'); return; }
  const fromYard = yards.find(y=>y.id===fromId);
  const toYard = toId ? yards.find(y=>y.id===toId) : null;
  const entry = {
    id: uid(), createdAt: new Date().toISOString(), date: document.getElementById('yardDate').value||todayStr(),
    shift: document.getElementById('yardShift').value||'', direction,
    cargoType: document.getElementById('yardCargoType').value,
    yardId: fromId, yardName: fromYard?fromYard.name:'',
    toYardId: toId||null, toYardName: toYard?toYard.name:null,
    quantity: qty, source: document.getElementById('yardSource').value,
    note: document.getElementById('yardNote').value.trim(), user: state.name
  };
  state.yardData.transactions.unshift(entry);
  log('yard','transaction',null,`${entry.direction} ${entry.yardName} ${entry.quantity}t`);
  saveState();
  yardDraftDirection = 'in';
  renderTab();
}

/* ---------- Balances dashboard ---------- */
function computeYardBalances(){
  ensureYardData();
  const balances = {};
  state.yardData.yards.forEach(y=> balances[y.id] = {name:y.name, in:0, out:0, transferIn:0, transferOut:0});
  state.yardData.transactions.forEach(t=>{
    if(!balances[t.yardId]) balances[t.yardId] = {name:t.yardName, in:0, out:0, transferIn:0, transferOut:0};
    if(t.direction==='in') balances[t.yardId].in += t.quantity;
    else if(t.direction==='out') balances[t.yardId].out += t.quantity;
    else if(t.direction==='transfer'){
      balances[t.yardId].transferOut += t.quantity;
      if(t.toYardId){
        if(!balances[t.toYardId]) balances[t.toYardId] = {name:t.toYardName, in:0, out:0, transferIn:0, transferOut:0};
        balances[t.toYardId].transferIn += t.quantity;
      }
    }
  });
  Object.values(balances).forEach(b=> b.balance = b.in + b.transferIn - b.out - b.transferOut);
  return balances;
}
function renderYardBalances(){
  const ar = currentLang()==='ar';
  const balances = computeYardBalances();
  const rows = Object.values(balances);
  return `
  <div class="card" style="margin-bottom:16px;">
    <h2>📊 ${ar?'الرصيد الحالي لكل يارد':'Current balance per yard'}</h2>
    ${!rows.length ? `<div class="empty muted">${ar?'لا توجد بيانات بعد':'No data yet'}</div>` :
    `<table><thead><tr>
      <th>${ar?'اليارد':'Yard'}</th><th>${ar?'إجمالي استلام':'Total received'}</th><th>${ar?'إجمالي صرف':'Total dispatched'}</th><th>${ar?'الرصيد الحالي':'Current balance'}</th>
    </tr></thead><tbody>
      ${rows.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${(b.in+b.transferIn).toLocaleString('en-US')} ${ar?'طن':'t'}</td><td>${(b.out+b.transferOut).toLocaleString('en-US')} ${ar?'طن':'t'}</td><td style="color:var(--gold);font-weight:800;">~${b.balance.toLocaleString('en-US')} ${ar?'طن (تقريبي)':'t (approx.)'}</td></tr>`).join('')}
    </tbody></table>`}
  </div>
  <div class="card">
    <h2>📈 ${ar?'رسم بياني — الكمية الحالية بكل يارد':'Chart — current quantity per yard'}</h2>
    <canvas id="chartYardBalance" height="110"></canvas>
  </div>`;
}
function renderYardChart(){
  if(yardSubTab!=='balances' || typeof Chart==='undefined') return;
  const c = document.getElementById('chartYardBalance');
  if(!c) return;
  if(kpiChartInstances.yardChart){ try{kpiChartInstances.yardChart.destroy();}catch(e){} }
  const ar = currentLang()==='ar';
  const balances = Object.values(computeYardBalances());

}

  if(!el){ alert('عنصر التصدير غير موجود'); return; }

  const originalBackground = el.style.background;
  const originalWidth = el.style.width;
  const originalMaxWidth = el.style.maxWidth;
  const originalOverflow = el.style.overflow;
  if(bgOverride) el.style.background = bgOverride;

  /* Expand to the complete table before html2canvas so no column is clipped. */
  const naturalWidth = Math.max(1200, el.scrollWidth, el.getBoundingClientRect().width);
  el.style.width = Math.ceil(naturalWidth) + 'px';
  el.style.maxWidth = 'none';
  el.style.overflow = 'visible';

  requestAnimationFrame(()=>{
    html2canvas(el, {
      scale: 2.4,
      useCORS: true,
      backgroundColor: bgOverride || null,
      windowWidth: Math.max(window.innerWidth, Math.ceil(naturalWidth) + 80),
      scrollX: 0,
      scrollY: -window.scrollY,
      logging: false
    }).then(canvas=>{
      el.style.background = originalBackground;
      el.style.width = originalWidth;
      el.style.maxWidth = originalMaxWidth;
      el.style.overflow = originalOverflow;

      composeWithLogo(canvas, bgOverride).then(finalCanvas=>{
        finalCanvas.toBlob(blob=>{
          if(!blob){ alert('تعذر توليد الصورة'); return; }
          const file = new File([blob], filename, {type:'image/png'});
          if(navigator.canShare && navigator.canShare({files:[file]})){
            navigator.share({files:[file], title:'Roster Report', text:'مشاركة تقرير الروستر'}).catch(err=>{
              if(err.name !== 'AbortError') downloadCanvas(finalCanvas, filename);
            });
          } else {
            downloadCanvas(finalCanvas, filename);
          }
        });
      });
    }).catch(err=>{
      el.style.background = originalBackground;
      el.style.width = originalWidth;
      el.style.maxWidth = originalMaxWidth;
      el.style.overflow = originalOverflow;
      console.error(err);
      alert('حدث خطأ أثناء تصدير الصورة');
    });
  });
}

/* Adds a dedicated brand header band ABOVE the captured content (never on top of
   it, so data is never obscured) with the AF Logic logo, name and export timestamp.
   Falls back to the plain content if the logo image can't be loaded. */
let _logoImgCache = null;
function composeWithLogo(sourceCanvas, bgOverride){
  return new Promise((resolve)=>{
    function draw(logo){
      const isDark = !!bgOverride && bgOverride.toLowerCase()!=='#ffffff';
      const bandH = Math.max(90, Math.min(170, Math.round(sourceCanvas.width*0.045)));
      const out = document.createElement('canvas');
      out.width = sourceCanvas.width;
      out.height = sourceCanvas.height + bandH;
      const ctx = out.getContext('2d');
      ctx.fillStyle = isDark ? (bgOverride||'#0b1220') : '#ffffff';
      ctx.fillRect(0,0,out.width,out.height);
      ctx.fillStyle = '#e8b93f';
      ctx.fillRect(0, bandH-4, out.width, 4);
      const pad = bandH*0.22;
      let textX = pad;
      if(logo){
        const logoH = bandH*0.6;
        const logoW = logoH * (logo.width/logo.height);
        ctx.drawImage(logo, pad, (bandH-logoH)/2, logoW, logoH);
        textX = pad + logoW + pad*0.7;
      }
      const ar = currentLang && currentLang()==='ar';
      ctx.textBaseline = 'middle';
      ctx.textAlign = ar ? 'right' : 'left';
      const anchorX = ar ? out.width - textX : textX;
      ctx.fillStyle = isDark ? '#f1f5f9' : '#141406';
      ctx.font = `700 ${Math.round(bandH*0.24)}px Arial, sans-serif`;
      ctx.fillText('AF Logic', anchorX, bandH*0.38);
      ctx.fillStyle = isDark ? '#9aa4b5' : '#5a5a5a';
      ctx.font = `400 ${Math.round(bandH*0.145)}px Arial, sans-serif`;
      ctx.fillText(ar ? 'Simply Better Logic — جناح عمليات الموانئ والورديات' : 'Simply Better Logic — Port Operations & Roster Suite', anchorX, bandH*0.68);
      ctx.textAlign = ar ? 'left' : 'right';
      ctx.font = `400 ${Math.round(bandH*0.16)}px Arial, sans-serif`;
      ctx.fillText(new Date().toLocaleString('en-GB'), ar ? pad : out.width-pad, bandH*0.5);
      ctx.drawImage(sourceCanvas, 0, bandH);
      resolve(out);
    }
    if(_logoImgCache){ draw(_logoImgCache); return; }
    const logo = new Image();
    logo.crossOrigin = 'anonymous';
    logo.onload = ()=>{ _logoImgCache = logo; draw(logo); };
    logo.onerror = ()=> draw(null);
    logo.src = 'af-logic-logo.png';
  });
}
function downloadCanvas(canvas, filename){
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
  link.remove();
}
function shareCurrent(){
  shareElement('captureArea', `roster_report_${todayStr()}.png`, '#08080A');
}

/* ===================== AI ASSISTANT CHAT ===================== */
function toggleAI(){
  const panel = document.getElementById('aiPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open') && !aiHistory.length){
    appendAIMsg('bot', 'أهلاً بك! أنا مساعدك الذكي لنظام Roster. يمكنك سؤالي عن توزيع الوناشين، تغطية الورديات، أو تحليل الأداء.');
  }
}
function appendAIMsg(sender, text){
  aiHistory.push({sender, text});
  const msgs = document.getElementById('aiMsgs');
  if(!msgs) return;
  msgs.innerHTML = aiHistory.map(m=>`<div class="ai-msg ${m.sender}">${esc(m.text)}</div>`).join('');
  msgs.scrollTop = msgs.scrollHeight;
}
async function sendAI(){
  const input = document.getElementById('aiInput');
  const q = input.value.trim();
  if(!q) return;
  input.value = '';
  appendAIMsg('user', q);

  if(!state.geminiApiKey){
    appendAIMsg('bot', 'يرجى إدخال مفتاح Gemini API في صفحة الإعدادات أولاً لتفعيل المحادثة الذكية.');
    return;
  }

  try{
    const summaryData = `اسم المستخدم: ${state.name}, الوردية: ${state.shiftName}, عدد الوناشين: ${state.crew.operators.length}, عدد المراكب: ${state.vessels.length}`;
    const sys = "أنت مساعد ذكي ومحترف لنظام إدارة الموانئ والروستر (Roster). أجب باختصار واحترانية باللغة العربية بناءً على سياق الموانئ و بيانات النظام.";
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent",
      {
        method:"POST",
        headers:{"Content-Type":"application/json","x-goog-api-key":state.geminiApiKey},
        body: JSON.stringify({
          systemInstruction:{ parts:[{text:sys}] },
          contents:[{ parts:[{text:`سياق النظام الحالي: ${summaryData}\n\nسؤال المستخدم: ${q}`}] }]
        })
      }
    );
    const data = await response.json();
    if(!response.ok) throw new Error(data.error?.message || 'HTTP error');
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'عذراً، لم أستطع الرد.';
    appendAIMsg('bot', reply);
  }catch(err){
    console.error(err);
    appendAIMsg('bot', 'حدث خطأ في الاتصال بالذكاء الاصطناعي: ' + err.message);
  }
}

function bindTabEvents(){
  if(currentTab==='reports') bindReportsSearch();
}

function esc(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}


function hideAFSplash(){
  const splash=document.getElementById('splash-screen');
  if(!splash) return;
  splash.classList.add('af-hide');
  setTimeout(()=>splash.remove(), 900);
}
setTimeout(hideAFSplash, 1900);

window.onload = function(){
  const savedLang = localStorage.getItem('roster_lang') || 'en';
  document.documentElement.setAttribute('lang', savedLang);
  document.documentElement.setAttribute('dir', savedLang==='ar'?'rtl':'ltr');
  checkAutoLogin();
  render();
};
